<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bella v25</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #fff5f8; 
            transition: background 1.2s ease;
            touch-action: none; 
        }
        #ui-container {
            position: absolute; 
            bottom: 50px; 
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; 
            pointer-events: none;
            z-index: 10;
        }
        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid currentColor;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-size: 20px;
            font-weight: 200;
        }
        .nav-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.4); }
        
        #ui-text {
            text-align: center;
            font-weight: 300; 
            letter-spacing: 3px; 
            font-size: 14px; 
            opacity: 0.8;
            min-width: 180px;
        }

        .theme-pink { color: #ff1493; }
        .theme-gold { color: #ffab00; }
        .theme-night { color: #a0a0ff; text-shadow: 0 0 15px rgba(100, 100, 255, 0.6); }
        
        #motion-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 253, 245, 0.95);
            padding: 24px 32px;
            border-radius: 16px;
            text-align: center;
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif;
            box-shadow: 0 8px 32px rgba(255, 180, 50, 0.3);
            z-index: 100;
            display: none;
            max-width: 280px;
        }
        #motion-prompt.visible { display: block; }
        #motion-prompt p {
            color: #886622;
            margin: 0 0 16px 0;
            font-size: 14px;
            line-height: 1.5;
        }
        #motion-prompt button {
            background: linear-gradient(135deg, #ffdd44, #ffaa00);
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            color: #553300;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #motion-prompt button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui-container" class="theme-pink">
        <div class="nav-btn" id="prevBtn">‹</div>
        <div id="ui-text">惊喜</div>
        <div class="nav-btn" id="nextBtn">›</div>
    </div>
    
    <div id="motion-prompt">
        <p>轻轻倾斜手机<br>让小太阳跟着你移动 ☀️</p>
        <button id="enableMotion">开启</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f8);
        const isMobile = window.innerWidth < 600;
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const amb = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(amb);
        const sunLight = new THREE.PointLight(0xfff700, 0, 30);
        scene.add(sunLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 2.5);
        topLight.position.set(5, 10, 5);
        scene.add(topLight);

        // --- STATE ---
        
        // Calculate Shenzhen Time (UTC+8)
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const shenzhenTime = new Date(utc + (3600000 * 8));
        const currentHour = shenzhenTime.getHours();

        let currentMode = 0; // Default: Surprise (09:00 - 21:00)

        if (currentHour >= 6 && currentHour < 9) {
            currentMode = 1; 
        } else if (currentHour >= 21 || currentHour < 6) {
            currentMode = 2;
        }

        let isHolding = false;
        let currentPattern = 0;
        let sunshineTime = 0;
        let targetPos = new THREE.Vector3(0, 0, 0);
        
        // --- ACCELEROMETER / MOTION STATE ---
        let motionEnabled = false;
        let motionPermissionAsked = false;
        let motionSupported = false;
        let tiltX = 0;
        let tiltY = 0;
        let rawTiltX = 0;
        let rawTiltY = 0;
        let neutralGamma = 0;
        let neutralBeta = 45;
        let needsCalibration = true;
        let autoDriftAngle = 0;

        // --- TEXTURE HELPER ---
        function createCircleTexture(color, size) {
            const matCanvas = document.createElement('canvas');
            matCanvas.width = size; matCanvas.height = size;
            const matCtx = matCanvas.getContext('2d');
            const center = size / 2;
            const gradient = matCtx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(120, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            matCtx.fillStyle = gradient;
            matCtx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(matCanvas);
        }

        // --- JEWEL ASSETS (MODES 0 & 1) ---
        const jewelGeo = new THREE.OctahedronGeometry(0.15, 0);
        const jewelIcoGeo = new THREE.IcosahedronGeometry(0.18, 0);
        const pinkColors = [0xff007f, 0xff69b4, 0xff1493, 0xffffff, 0xffc1cc, 0xfce4ec];
        const goldColors = [0xffff00, 0xffd700, 0xffaa00, 0xffffff];

        const patterns = [];
        const qOffset = (isMobile ? 1.0 : 1.8) + 0.15;
        
        // Pattern 0: QT
        const qt = [];
        for(let i=0; i<50; i++) { let a = (i/50)*Math.PI*2; qt.push({x: Math.cos(a)*1.6 - qOffset, y: Math.sin(a)*1.6}); }
        for(let i=0; i<8; i++) qt.push({x: (-qOffset + 0.8) + i*0.15, y: -0.8 - i*0.15});
        const tStartX = 0.5 - 0.15;
        for(let i=0; i<18; i++) qt.push({x: tStartX + i*0.2, y: 1.6});
        for(let i=0; i<18; i++) qt.push({x: tStartX + 1.7, y: 1.6 - i*0.2});
        patterns.push(qt);

        // Pattern 1: Smiley face
        const smile = [];
        for(let i=0; i<45; i++) { let a = (i/45)*Math.PI*2; smile.push({x: Math.cos(a)*2.2, y: Math.sin(a)*2.2}); }
        smile.push({x: -0.8, y: 0.7}, {x: 0.8, y: 0.7});
        for(let i=0; i<20; i++) { let a = Math.PI + 0.4 + (i/20)*(Math.PI - 0.8); smile.push({x: Math.cos(a)*1.3, y: Math.sin(a)*0.9 - 0.1}); }
        patterns.push(smile);

        // Pattern 2: Rose/Flower
        const rose = [];
        for(let i=0; i<40; i++) { let a = (i/40)*Math.PI*2; let r = 0.8 + Math.cos(a*5)*0.3; rose.push({x: Math.cos(a)*r, y: Math.sin(a)*r + 1.2}); }
        for(let i=0; i<18; i++) rose.push({x: 0, y: 0.8 - i*0.25});
        rose.push({x: 0.3, y: -0.5}, {x: -0.3, y: -1.2});
        patterns.push(rose);

        // Pattern 3: Cute Sun with smiling face
        const sunPattern = [];
        for(let i=0; i<40; i++) { 
            let a = (i/40)*Math.PI*2; 
            sunPattern.push({x: Math.cos(a)*1.4, y: Math.sin(a)*1.4}); 
        }
        for(let r=0; r<8; r++) {
            let rayAngle = (r/8)*Math.PI*2 + Math.PI/8;
            for(let i=0; i<4; i++) {
                let dist = 1.6 + i*0.3;
                sunPattern.push({x: Math.cos(rayAngle)*dist, y: Math.sin(rayAngle)*dist});
            }
        }
        sunPattern.push({x: -0.5, y: 0.35});
        for(let i=0; i<6; i++) { 
            let a = (i/6)*Math.PI*2; 
            sunPattern.push({x: -0.5 + Math.cos(a)*0.15, y: 0.35 + Math.sin(a)*0.15}); 
        }
        sunPattern.push({x: 0.5, y: 0.35});
        for(let i=0; i<6; i++) { 
            let a = (i/6)*Math.PI*2; 
            sunPattern.push({x: 0.5 + Math.cos(a)*0.15, y: 0.35 + Math.sin(a)*0.15}); 
        }
        for(let i=0; i<16; i++) { 
            let a = Math.PI + (i/15)*Math.PI;
            sunPattern.push({x: Math.cos(a)*0.6, y: Math.sin(a)*0.35 - 0.2}); 
        }
        sunPattern.push({x: -0.85, y: 0.0});
        sunPattern.push({x: -0.75, y: -0.08});
        sunPattern.push({x: 0.85, y: 0.0});
        sunPattern.push({x: 0.75, y: -0.08});
        patterns.push(sunPattern);

        // Physics constants for Mode 0
        const SPRING_STIFFNESS = 0.08;
        const SPRING_DAMPING = 0.82;
        const GRAVITY = -0.012;
        const GROUND_Y = -3.5;
        const GROUND_BOUNCE = 0.3;
        const GROUND_FRICTION = 0.85;
        const SETTLE_THRESHOLD = 0.001;

        const objects = [];
        for (let i = 0; i < 420; i++) {
            const mat = new THREE.MeshPhysicalMaterial({ 
                color: pinkColors[i % pinkColors.length], 
                metalness: 0.1, 
                roughness: 0.02, 
                transmission: 0.4, 
                thickness: 1.0, 
                ior: 1.5, 
                clearcoat: 1.0 
            });
            const mesh = new THREE.Mesh(jewelGeo, mat);
            const pileX = (Math.random()-0.5)*5;
            const pileY = GROUND_Y + Math.random()*0.8;
            const pileZ = (Math.random()-0.5)*2;
            mesh.position.set(pileX, pileY, pileZ);
            scene.add(mesh);
            objects.push({ 
                mesh, 
                restPosition: new THREE.Vector3(pileX, pileY, pileZ),
                targets: [], 
                velocity: new THREE.Vector3(0, 0, 0),
                launchDelay: Math.random() * 0.3,
                wobbleOffset: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.5 + Math.random() * 0.5,
                isSettled: true,
                restTime: 0,
                frozen: false
            });
        }

        patterns.forEach((pts) => {
            const scale = isMobile ? 0.75 : 1.0;
            objects.forEach((obj, i) => {
                let target = new THREE.Vector3();
                if (i < pts.length) {
                    target.set(pts[i].x * scale, pts[i].y * scale, 0);
                } else {
                    target.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, -50);
                }
                obj.targets.push(target);
            });
        });

        // --- SUN GROUP (MODE 1) ---
        const sunGroup = new THREE.Group();
        sunGroup.visible = false;
        scene.add(sunGroup);
        const sunSphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffea00, emissiveIntensity: 1.2 }));
        sunGroup.add(sunSphere);
        const faceMat = new THREE.MeshBasicMaterial({ color: 0xfffdf0 });
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), faceMat);
        eyeL.position.set(-0.25, 0.2, 0.85); sunGroup.add(eyeL);
        const eyeR = eyeL.clone(); eyeR.position.set(0.25, 0.2, 0.85); sunGroup.add(eyeR);
        const sunSmile = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.04, 12, 20, Math.PI), faceMat);
        sunSmile.position.set(0, -0.05, 0.82); sunSmile.rotation.x = Math.PI * 0.95; sunGroup.add(sunSmile);
        
        const cheekMat = new THREE.MeshBasicMaterial({ color: 0xffccaa, transparent: true, opacity: 0.5 });
        const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), cheekMat);
        cheekL.position.set(-0.55, -0.05, 0.75); sunGroup.add(cheekL);
        const cheekR = cheekL.clone(); cheekR.position.set(0.55, -0.05, 0.75); sunGroup.add(cheekR);
        
        // --- ACCELEROMETER / MOTION SETUP ---
        const motionPrompt = document.getElementById('motion-prompt');
        const enableMotionBtn = document.getElementById('enableMotion');
        
        if (window.DeviceOrientationEvent) {
            motionSupported = true;
        }
        
        function handleOrientation(event) {
            if (!motionEnabled) return;
            
            const gamma = event.gamma || 0;
            const beta = event.beta || 0;
            
            if (needsCalibration) {
                neutralGamma = gamma;
                neutralBeta = beta;
                needsCalibration = false;
            }
            
            const maxTilt = 25;
            const relativeGamma = gamma - neutralGamma;
            const relativeBeta = beta - neutralBeta;
            
            rawTiltX = Math.max(-1, Math.min(1, relativeGamma / maxTilt));
            rawTiltY = Math.max(-1, Math.min(1, relativeBeta / maxTilt));
            
            tiltX = tiltX * 0.7 + rawTiltX * 0.3;
            tiltY = tiltY * 0.7 + rawTiltY * 0.3;
            
            const softener = (v) => {
                const abs = Math.abs(v);
                if (abs > 0.7) {
                    const excess = abs - 0.7;
                    const dampened = 0.7 + excess * 0.4;
                    return Math.sign(v) * Math.min(dampened, 0.9);
                }
                return v;
            };
            tiltX = softener(tiltX);
            tiltY = softener(tiltY);
        }
        
        function recalibrateTilt() {
            if (motionEnabled) {
                neutralGamma += rawTiltX * 25;
                neutralBeta += rawTiltY * 25;
                tiltX = 0;
                tiltY = 0;
            }
        }
        
        async function requestMotionPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        motionEnabled = true;
                    }
                } catch (e) {
                    console.log('Motion permission denied or error:', e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                motionEnabled = true;
            }
            motionPrompt.classList.remove('visible');
            motionPermissionAsked = true;
        }
        
        enableMotionBtn.addEventListener('click', requestMotionPermission);
        
        function checkShowMotionPrompt() {
            if (isMobile && currentMode === 1 && motionSupported && !motionPermissionAsked && !motionEnabled) {
                motionPrompt.classList.add('visible');
            } else {
                motionPrompt.classList.remove('visible');
            }
        }

        // --- NIGHT ASSETS (MODE 2) ---
        const nightGroup = new THREE.Group();
        nightGroup.visible = false;
        scene.add(nightGroup);

        // Stars
        const starCount = 1500;
        const starGeo = new THREE.BufferGeometry();
        const starPosArr = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        const starBaseSizes = new Float32Array(starCount);
        const starTwinkleTime = new Float32Array(starCount);
        const starTwinkling = new Uint8Array(starCount);
        
        for(let i=0; i<starCount; i++) {
            starPosArr[i*3] = (Math.random() - 0.5) * 60;
            starPosArr[i*3+1] = (Math.random() - 0.5) * 40;
            starPosArr[i*3+2] = -5 - Math.random() * 15;
            const baseSize = 0.08 + Math.random() * 0.06;
            starBaseSizes[i] = baseSize;
            starSizes[i] = baseSize;
            starTwinkleTime[i] = Math.random() * 10;
            starTwinkling[i] = 0;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        
        const starMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.1, 
            transparent: true, 
            opacity: 0.85,
            blending: THREE.AdditiveBlending, 
            map: createCircleTexture('#ffffff', 64),
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starGeo, starMat);
        nightGroup.add(stars);
        
        let starTime = 0;
        
        // Goodnight Text
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024; canvas.height = 512;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 240px serif'; 
        ctx.textAlign = 'center';
        ctx.fillText('晚安', 512, 330);
        
        const imageData = ctx.getImageData(0, 0, 1024, 512);
        const textPointsArr = [];
        const textPointsOriginal = [];
        for (let y = 0; y < 512; y += 4) {
            for (let x = 0; x < 1024; x += 4) {
                if (imageData.data[(y * 1024 + x) * 4] > 128) {
                    const jitter = 0.12;
                    const px = (x - 512) / 100 + (Math.random()-0.5) * jitter;
                    const py = -(y - 256) / 100 + (Math.random()-0.5) * jitter;
                    const pz = (Math.random()-0.5) * 0.2;
                    textPointsArr.push(px, py, pz);
                    textPointsOriginal.push(px, py, pz);
                }
            }
        }
        const textGeo = new THREE.BufferGeometry();
        textGeo.setAttribute('position', new THREE.Float32BufferAttribute(textPointsArr, 3));
        const textMat = new THREE.PointsMaterial({ 
            color: 0xccddff, 
            size: 0.05, 
            transparent: true, 
            opacity: 0.75, 
            blending: THREE.AdditiveBlending 
        });
        const textMesh = new THREE.Points(textGeo, textMat);
        textMesh.position.y = -0.3;
        nightGroup.add(textMesh);
        const textPositions = textMesh.geometry.attributes.position;

        // Night Burst Particles
        const pCount = 800; 
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3).fill(0);
        const pVel = new Float32Array(pCount * 3).fill(0);
        const pLife = new Float32Array(pCount).fill(0); 
        const pPhase = new Float32Array(pCount);
        const particleColors = new Float32Array(pCount * 3);
        const pScales = new Float32Array(pCount).fill(1.0);
        
        for (let i = 0; i < pCount; i++) {
            pPhase[i] = Math.random() * Math.PI * 2;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        pGeo.setAttribute('aScale', new THREE.BufferAttribute(pScales, 1));

        const pMat = new THREE.PointsMaterial({ 
            size: 0.22, 
            transparent: true, 
            blending: THREE.AdditiveBlending, 
            vertexColors: true, 
            map: createCircleTexture('#ffffdd', 64), 
            depthWrite: false 
        });
        pMat.sizeAttenuation = true;
        pMat.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nattribute float aScale;')
                .replace('#include <size_vertex>', 
                    'gl_PointSize = size * aScale;\n#ifdef USE_SIZEATTENUATION\n  gl_PointSize *= ( scale / - mvPosition.z );\n#endif'
                );
        };
        const nightParticles = new THREE.Points(pGeo, pMat);
        nightGroup.add(nightParticles);

        const posA = nightParticles.geometry.attributes.position;
        const colA = nightParticles.geometry.attributes.color;
        const scaleAttr = nightParticles.geometry.attributes.aScale;

        let pIndex = 0;
        
        function spawnNightParticles() {
            for(let i = 0; i < 5; i++) {
                const idx = pIndex % pCount;
                const i3 = idx * 3;
                pPos[i3] = targetPos.x + (Math.random() - 0.5) * 0.3;
                pPos[i3+1] = targetPos.y + (Math.random() - 0.5) * 0.3;
                pPos[i3+2] = targetPos.z;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.008 + Math.random() * 0.012;
                pVel[i3] = Math.cos(angle) * speed;
                pVel[i3+1] = Math.sin(angle) * speed + 0.01;
                pVel[i3+2] = (Math.random() - 0.5) * 0.005;
                
                pLife[idx] = 1.0;
                pPhase[idx] = Math.random() * Math.PI * 2;
                
                const colorChoice = Math.random();
                if (colorChoice < 0.4) {
                    particleColors[i3] = 1.0;
                    particleColors[i3+1] = 0.85;
                    particleColors[i3+2] = 0.4;
                } else if (colorChoice < 0.7) {
                    particleColors[i3] = 0.8;
                    particleColors[i3+1] = 0.85;
                    particleColors[i3+2] = 1.0;
                } else {
                    particleColors[i3] = 1.0;
                    particleColors[i3+1] = 0.7;
                    particleColors[i3+2] = 0.3;
                }
                
                pScales[idx] = 0.8 + Math.random() * 0.4;
                pIndex++;
            }
        }
        
        // Shooting star (extremely subtle trail)
        let shootingStarActive = false;
        let shootingStarTime = 0;
        let shootingStarNextTime = 3 + Math.random() * 5;
        let shootingStarPos = new THREE.Vector3();
        let shootingStarVel = new THREE.Vector3();
        
        const shootingStarGeo = new THREE.SphereGeometry(0.07, 8, 8);
        shootingStarGeo.scale(1, 1, 3.5);
        const shootingStarMat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0, 
            blending: THREE.AdditiveBlending
        });
        const shootingStar = new THREE.Mesh(shootingStarGeo, shootingStarMat);
        nightGroup.add(shootingStar);

        // Subtle trail
        const trailLength = 20;
        const trailPositions = new Float32Array(trailLength * 3);
        const trailAlphas = new Float32Array(trailLength);
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeo.setAttribute('alpha', new THREE.BufferAttribute(trailAlphas, 1));

        const trailMat = new THREE.ShaderMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexShader: `
                attribute float alpha;
                varying float vAlpha;
                void main() {
                    vAlpha = alpha;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = 10.0 * alpha * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    float dist = length(uv);
                    if (dist > 0.5) discard;
                    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * (1.0 - dist * 2.0));
                }
            `
        });

        const shootingStarTrail = new THREE.Points(trailGeo, trailMat);
        nightGroup.add(shootingStarTrail);

        let nightTouchPos = new THREE.Vector3(0, 0, 0);

        // --- THEME SWAP ---
        const updateMode = () => {
            const ui = document.getElementById('ui-container');
            const txt = document.getElementById('ui-text');
            sunGroup.visible = (currentMode === 1);
            nightGroup.visible = (currentMode === 2);
            objects.forEach(obj => obj.mesh.visible = (currentMode !== 2));

            if (currentMode === 0) {
                scene.background.set(0xfff5f8);
                ui.className = 'theme-pink';
                txt.innerText = '长按开启惊喜';
                sunLight.intensity = 0;
                objects.forEach((obj, i) => {
                    obj.mesh.geometry = jewelGeo;
                    obj.mesh.material.color.set(pinkColors[i % pinkColors.length]);
                    obj.mesh.material.emissiveIntensity = 0;
                });
                motionPrompt.classList.remove('visible');
            } else if (currentMode === 1) {
                scene.background.set(0xfffdf5);
                ui.className = 'theme-gold';
                txt.innerText = '阳光';
                objects.forEach((obj, i) => {
                    obj.mesh.geometry = jewelIcoGeo;
                    const c = goldColors[i % goldColors.length];
                    obj.mesh.material.color.set(c);
                    obj.mesh.material.emissive.set(c);
                    obj.mesh.material.emissiveIntensity = 0.5;
                });
                checkShowMotionPrompt();
            } else {
                scene.background.set(0x020205);
                ui.className = 'theme-night';
                txt.innerText = '晚安';
                motionPrompt.classList.remove('visible');
            }
        };

        let holdStartTime = 0;

        // --- INPUTS ---
        const handleDown = (e) => {
            if (e.target.closest('.nav-btn')) return;
            isHolding = true;
            holdStartTime = Date.now() * 0.001;
            if (window.navigator.vibrate) window.navigator.vibrate(10);
            updateTarget(e);
            
            objects.forEach(obj => {
                obj.isSettled = false;
                obj.restTime = 0;
                obj.frozen = false;
            });
        };
        const updateTarget = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            if(currentMode === 2) {
                const vec = new THREE.Vector3(x, y, 0.5).unproject(camera);
                const dir = vec.sub(camera.position).normalize();
                targetPos.copy(camera.position).add(dir.multiplyScalar(-camera.position.z / dir.z));
            } else {
                targetPos.set(x * 7.5, y * 5.5, 0);
            }
        };

        window.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointermove', updateTarget);
        window.addEventListener('pointerup', () => {
            if (!isHolding) return;
            isHolding = false;
            if (currentMode === 0) {
                currentPattern = (currentPattern + 1) % patterns.length;
                objects.forEach(obj => {
                    obj.velocity.y += 0.02 + Math.random() * 0.03;
                    obj.velocity.x += (Math.random() - 0.5) * 0.02;
                    obj.isSettled = false;
                });
            } else if (currentMode === 1 && isMobile) {
                recalibrateTilt();
            }
        });

        document.getElementById('prevBtn').onclick = () => { currentMode = (currentMode + 2) % 3; updateMode(); };
        document.getElementById('nextBtn').onclick = () => { currentMode = (currentMode + 1) % 3; updateMode(); };

        updateMode();

        // --- ANIMATION LOOP ---
        camera.position.z = isMobile ? 15 : 13;
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (currentMode === 0) {
                const currentTime = Date.now() * 0.001;
                
                objects.forEach((obj, index) => {
                    
                    if (isHolding) {
                        obj.restTime = 0;
                        obj.frozen = false;
                        
                        const target = obj.targets[currentPattern];
                        
                        const timeSinceHold = currentTime - holdStartTime;
                        const launchProgress = Math.max(0, Math.min(1, (timeSinceHold - obj.launchDelay) * 3));
                        
                        if (launchProgress > 0) {
                            const dx = target.x - obj.mesh.position.x;
                            const dy = target.y - obj.mesh.position.y;
                            const dz = target.z - obj.mesh.position.z;
                            
                            const stiffness = SPRING_STIFFNESS * launchProgress;
                            obj.velocity.x += dx * stiffness;
                            obj.velocity.y += dy * stiffness;
                            obj.velocity.z += dz * stiffness;
                            
                            obj.velocity.multiplyScalar(SPRING_DAMPING);
                            
                            const distToTarget = Math.sqrt(dx*dx + dy*dy + dz*dz);
                            if (distToTarget < 0.5) {
                                const wobble = Math.sin(time * obj.wobbleSpeed * 8 + obj.wobbleOffset) * 0.002;
                                obj.velocity.x += wobble;
                                obj.velocity.y += Math.cos(time * obj.wobbleSpeed * 6 + obj.wobbleOffset) * 0.002;
                            }
                        }
                    } else {
                        if (obj.frozen) return;
                        
                        obj.velocity.y += GRAVITY;
                        
                        if (obj.mesh.position.z < -5) {
                            obj.velocity.z += 0.02;
                        }
                        
                        if (obj.mesh.position.y <= GROUND_Y + 0.15) {
                            obj.mesh.position.y = GROUND_Y + 0.15;
                            
                            if (obj.velocity.y < -0.01) {
                                obj.velocity.y *= -GROUND_BOUNCE;
                                obj.velocity.x += (Math.random() - 0.5) * 0.02;
                            } else {
                                obj.velocity.y = 0;
                            }
                            
                            obj.velocity.x *= GROUND_FRICTION;
                            obj.velocity.z *= GROUND_FRICTION;
                            
                            if (obj.mesh.position.z < -1) {
                                obj.mesh.position.z += 0.1;
                            }
                            
                            const speed = obj.velocity.length();
                            if (speed < SETTLE_THRESHOLD) {
                                obj.velocity.set(0, 0, 0);
                                obj.isSettled = true;
                            }
                        }
                        
                        obj.velocity.multiplyScalar(0.995);
                        
                        if (obj.isSettled) {
                            obj.restTime += 0.016;
                            if (obj.restTime > 1.5) {
                                obj.frozen = true;
                                obj.velocity.set(0, 0, 0);
                            }
                        }
                    }
                    
                    if (!obj.frozen) {
                        obj.mesh.position.add(obj.velocity);
                    }
                    
                    const speed = obj.velocity.length();
                    if (speed > 0.001) {
                        obj.mesh.rotation.x += obj.velocity.y * 0.5;
                        obj.mesh.rotation.y += obj.velocity.x * 0.5;
                        obj.mesh.rotation.z += speed * 0.1;
                    }
                });
            } else if (currentMode === 1) {
                sunshineTime += 0.008;
                
                if (isMobile && !isHolding) {
                    if (motionEnabled) {
                        const tiltRange = 4;
                        targetPos.x = tiltX * tiltRange;
                        targetPos.y = tiltY * tiltRange;
                        targetPos.z = 0;
                    } else {
                        autoDriftAngle += 0.008;
                        targetPos.x = Math.sin(autoDriftAngle) * 2.5;
                        targetPos.y = Math.sin(autoDriftAngle * 2) * 1.5;
                        targetPos.z = 0;
                    }
                }
                
                sunGroup.position.lerp(targetPos, 0.08);
                sunLight.position.copy(sunGroup.position);
                
                const glowPulse = Math.sin(time * 1.5) * 0.15;
                const baseIntensity = isHolding ? 30 : 12;
                sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, baseIntensity + glowPulse * 5, 0.1);
                
                sunSphere.material.emissiveIntensity = 1.1 + glowPulse;
                
                const targetScale = isHolding ? 1.18 : 1.0 + Math.sin(time * 2) * 0.03;
                sunSphere.scale.lerp(new THREE.Vector3().setScalar(targetScale), 0.1);
                
                const warmth = isHolding ? 0.12 : 0.08;
                sunSphere.material.color.lerp(
                    new THREE.Color(isHolding ? 0xffdd44 : 0xffff00), 
                    warmth
                );
                sunSphere.material.emissive.lerp(
                    new THREE.Color(isHolding ? 0xffaa00 : 0xffea00), 
                    warmth
                );
                
                const sunSpeed = sunGroup.position.distanceTo(targetPos);
                const squint = isHolding ? 0.6 : Math.max(0.85, 1 - sunSpeed * 2);
                
                eyeL.scale.y = THREE.MathUtils.lerp(eyeL.scale.y, squint, 0.1);
                eyeR.scale.y = THREE.MathUtils.lerp(eyeR.scale.y, squint, 0.1);
                
                const cheekOpacity = isHolding ? 0.7 : 0.4;
                cheekL.material.opacity = THREE.MathUtils.lerp(cheekL.material.opacity, cheekOpacity, 0.1);
                cheekR.material.opacity = cheekL.material.opacity;
                
                const smileScale = isHolding ? 1.15 : 1.0;
                sunSmile.scale.lerp(new THREE.Vector3().setScalar(smileScale), 0.08);
                
                objects.forEach((j) => {
                    if (isHolding) {
                        const vT = sunGroup.position.clone().add(new THREE.Vector3(0, 0, 1.2));
                        const dir = new THREE.Vector3().subVectors(vT, j.mesh.position);
                        const dist = dir.length();
                        dir.normalize();
                        j.velocity.add(dir.clone().multiplyScalar((15 - dist) * 0.015));
                        j.velocity.add(new THREE.Vector3(-dir.y, dir.x, 0).multiplyScalar(0.05));
                        if(dist < 3.0) j.velocity.add(dir.clone().multiplyScalar(-0.08));
                    } else {
                        const a = (sunshineTime * j.wobbleSpeed) + j.wobbleOffset;
                        const rB = 1.0 + Math.sin(sunshineTime * 0.5 + j.wobbleOffset) * 0.3;
                        const bT = sunGroup.position.clone().add(new THREE.Vector3(Math.cos(a)*rB, Math.sin(a)*rB, -0.6));
                        const dir = new THREE.Vector3().subVectors(bT, j.mesh.position);
                        j.velocity.add(dir.normalize().multiplyScalar(Math.max(0, (12 - dir.length()) * 0.008)));
                        const cDir = new THREE.Vector3().subVectors(sunGroup.position, j.mesh.position);
                        if(cDir.length() < 1.1) j.velocity.add(cDir.normalize().multiplyScalar(-0.015));
                        if (j.mesh.position.z > sunGroup.position.z - 0.2) j.velocity.z -= 0.02;
                    }
                    j.velocity.multiplyScalar(0.92);
                    j.mesh.position.add(j.velocity);
                    j.mesh.rotation.x += 0.02; j.mesh.rotation.y += 0.02;
                });
            } else if (currentMode === 2) {
                
                starTime += 0.016;
                const starSizeAttr = starGeo.attributes.size;
                
                if (Math.random() < 0.03) {
                    const randomStar = Math.floor(Math.random() * starCount);
                    if (!starTwinkling[randomStar]) {
                        starTwinkling[randomStar] = 1;
                        starTwinkleTime[randomStar] = 0;
                    }
                }
                
                for (let i = 0; i < starCount; i++) {
                    if (starTwinkling[i]) {
                        starTwinkleTime[i] += 0.05;
                        if (starTwinkleTime[i] < 1) {
                            starSizeAttr.array[i] = starBaseSizes[i] * (1 + starTwinkleTime[i] * 1.5);
                        } else if (starTwinkleTime[i] < 2) {
                            starSizeAttr.array[i] = starBaseSizes[i] * (1 + (2 - starTwinkleTime[i]) * 1.5);
                        } else {
                            starSizeAttr.array[i] = starBaseSizes[i];
                            starTwinkling[i] = 0;
                        }
                    }
                }
                starSizeAttr.needsUpdate = true;
                
                const textPosArray = textPositions.array;
                for (let i = 0; i < textPointsOriginal.length / 3; i++) {
                    const i3 = i * 3;
                    const drift = Math.sin(time * 0.6 + textPointsOriginal[i3] * 0.4) * 0.006;
                    textPosArray[i3] = textPointsOriginal[i3] + drift;
                    textPosArray[i3+1] = textPointsOriginal[i3+1] + Math.sin(time * 0.5 + i * 0.003) * 0.004;
                }
                textPositions.needsUpdate = true;
                
                textMat.opacity = 0.7 + Math.sin(time * 0.6) * 0.08;
                textMesh.rotation.y = Math.sin(time * 0.15) * 0.015;
                
                textMat.color.setHSL(0.62, 0.3, 0.8);
                
                if (isHolding) {
                    spawnNightParticles();
                    textMat.color.setHSL(0.1, 0.45, 0.85);
                    textMat.opacity = 0.9;
                }
                
                for (let i = 0; i < pCount; i++) {
                    if (pLife[i] > 0) {
                        const i3 = i * 3;
                        
                        const wobble = Math.sin(time * 2 + pPhase[i]) * 0.002;
                        pVel[i3] += wobble;
                        pVel[i3+1] += 0.0003;
                        
                        posA.array[i3] += pVel[i3];
                        posA.array[i3+1] += pVel[i3+1];
                        posA.array[i3+2] += pVel[i3+2];
                        
                        pVel[i3] *= 0.995;
                        pVel[i3+1] *= 0.995;
                        pVel[i3+2] *= 0.995;
                        
                        pLife[i] -= 0.0045;
                        const alpha = Math.max(0, pLife[i]);
                        
                        scaleAttr.array[i] = pScales[i] * (1 + (1 - alpha) * 0.5);
                        
                        colA.array[i3] = particleColors[i3] * alpha;
                        colA.array[i3+1] = particleColors[i3+1] * alpha;
                        colA.array[i3+2] = particleColors[i3+2] * alpha;
                        
                        if (pLife[i] <= 0) {
                            posA.array[i3] = 5000;
                            posA.array[i3+1] = 5000;
                            posA.array[i3+2] = 5000;
                        }
                    }
                }
                posA.needsUpdate = true;
                colA.needsUpdate = true;
                scaleAttr.needsUpdate = true;
                
                // Shooting star update (much more subtle)
                shootingStarTime += 0.016;
                
                if (!shootingStarActive && shootingStarTime > shootingStarNextTime) {
                    shootingStarActive = true;
                    shootingStarTime = 0;
                    
                    shootingStarPos.set(
                        (Math.random() - 0.3) * 15,
                        5 + Math.random() * 5,
                        -8 - Math.random() * 5
                    );
                    shootingStarVel.set(
                        -0.15 - Math.random() * 0.1,
                        -0.2 - Math.random() * 0.15,
                        0.05
                    );
                    shootingStar.position.copy(shootingStarPos);
                    shootingStarMat.opacity = 0;

                    // Reset trail
                    for (let i = 0; i < trailLength; i++) {
                        trailAlphas[i] = 0;
                    }
                    trailGeo.attributes.alpha.needsUpdate = true;
                }
                
                if (shootingStarActive) {
                    shootingStarPos.add(shootingStarVel);
                    shootingStar.position.copy(shootingStarPos);
                    shootingStar.lookAt(shootingStarPos.clone().add(shootingStarVel));
                    
                    const starLife = shootingStarTime;
                    if (starLife < 0.3) {
                        shootingStarMat.opacity = starLife / 0.3 * 0.6;
                    } else if (starLife < 1.2) {
                        shootingStarMat.opacity = 0.6;
                    } else {
                        shootingStarMat.opacity = Math.max(0, 0.6 - (starLife - 1.2) * 1.5);
                    }
                    
                    if (starLife > 1.7 || shootingStarPos.y < -10) {
                        shootingStarActive = false;
                        shootingStarMat.opacity = 0;
                        shootingStarNextTime = 4 + Math.random() * 8;
                        shootingStarTime = 0;
                    }

                    // Trail update
                    for (let i = trailLength - 1; i > 0; i--) {
                        const i3 = i * 3;
                        const prev3 = (i - 1) * 3;
                        trailPositions[i3] = trailPositions[prev3];
                        trailPositions[i3 + 1] = trailPositions[prev3 + 1];
                        trailPositions[i3 + 2] = trailPositions[prev3 + 2];
                        trailAlphas[i] = trailAlphas[i - 1] * 0.85;
                    }
                    trailPositions[0] = shootingStarPos.x;
                    trailPositions[1] = shootingStarPos.y;
                    trailPositions[2] = shootingStarPos.z;
                    trailAlphas[0] = 0.5;

                    trailGeo.attributes.position.needsUpdate = true;
                    trailGeo.attributes.alpha.needsUpdate = true;
                } else {
                    // Fade remaining trail
                    for (let i = 0; i < trailLength; i++) {
                        trailAlphas[i] *= 0.85;
                    }
                    trailGeo.attributes.alpha.needsUpdate = true;
                }
            }

            camera.position.x = Math.sin(time * 0.15) * 0.4;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
