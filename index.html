<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Jewel Triple v16</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #fff5f8; 
            touch-action: none; 
        }
        #ui {
            position: absolute; 
            bottom: 60px; 
            width: 100%; 
            text-align: center;
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; 
            color: #ff1493; 
            font-weight: 300; 
            letter-spacing: 4px; 
            pointer-events: none;
            font-size: 14px; 
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="ui">长按开启惊喜</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f8);
        const isMobile = window.innerWidth < 600;
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        const topLight = new THREE.DirectionalLight(0xffffff, 2.5);
        topLight.position.set(5, 10, 5);
        scene.add(topLight);

        const jewelGeo = new THREE.OctahedronGeometry(0.15, 0); 
        const colors = [0xff007f, 0xff69b4, 0xff1493, 0xffffff, 0xffc1cc, 0xfce4ec];

        const patterns = [];

        // 1. QT - Shifted Left by ~0.15 units (one jewel width)
        const qt = [];
        // qOffset increased by 0.15 to shift the Q left
        const qOffset = (isMobile ? 1.0 : 1.8) + 0.15; 
        for(let i=0; i<50; i++) { let a = (i/50)*Math.PI*2; qt.push({x: Math.cos(a)*1.6 - qOffset, y: Math.sin(a)*1.6}); }
        for(let i=0; i<8; i++) qt.push({x: (-qOffset + 0.8) + i*0.15, y: -0.8 - i*0.15});
        // T starting X decreased by 0.15 to shift the T left
        const tStartX = 0.5 - 0.15;
        for(let i=0; i<18; i++) qt.push({x: tStartX + i*0.2, y: 1.6});
        for(let i=0; i<18; i++) qt.push({x: tStartX + 1.7, y: 1.6 - i*0.2});
        patterns.push(qt);

        // 2. 🙂 (Centered)
        const smile = [];
        for(let i=0; i<45; i++) { let a = (i/45)*Math.PI*2; smile.push({x: Math.cos(a)*2.2, y: Math.sin(a)*2.2}); }
        smile.push({x: -0.8, y: 0.7}, {x: 0.8, y: 0.7});
        for(let i=0; i<20; i++) { let a = Math.PI + 0.4 + (i/20)*(Math.PI - 0.8); smile.push({x: Math.cos(a)*1.3, y: Math.sin(a)*0.9 - 0.1}); }
        patterns.push(smile);

        // 3. 🌹 (Centered)
        const rose = [];
        for(let i=0; i<40; i++) { 
            let a = (i/40)*Math.PI*2; 
            let r = 0.8 + Math.cos(a*5)*0.3; 
            rose.push({x: Math.cos(a)*r, y: Math.sin(a)*r + 1.2}); 
        }
        for(let i=0; i<18; i++) rose.push({x: 0, y: 0.8 - i*0.25});
        rose.push({x: 0.3, y: -0.5}, {x: -0.3, y: -1.2});
        patterns.push(rose);

        const objects = [];
        for (let i = 0; i < 420; i++) {
            const mat = new THREE.MeshPhysicalMaterial({ color: colors[i % colors.length], metalness: 0.1, roughness: 0.02, transmission: 0.4, thickness: 1.0, ior: 1.5, clearcoat: 1.0 });
            const mesh = new THREE.Mesh(jewelGeo, mat);
            const startP = new THREE.Vector3((Math.random()-0.5)*4.5, -3.5 + Math.random(), (Math.random()-0.5)*2);
            mesh.position.copy(startP);
            scene.add(mesh);
            objects.push({ mesh, startP, targets: [] });
        }

        patterns.forEach((pts) => {
            const scale = isMobile ? 0.75 : 1.0;
            objects.forEach((obj, i) => {
                let target = new THREE.Vector3();
                if (i < pts.length) target.set(pts[i].x * scale, pts[i].y * scale, 0);
                else target.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, -50);
                obj.targets.push(target);
            });
        });

        camera.position.z = isMobile ? 15 : 13; 
        let isHolding = false;
        let currentPattern = 0;

        window.addEventListener('pointerdown', () => {
            isHolding = true;
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });

        window.addEventListener('pointerup', () => {
            isHolding = false;
            currentPattern = (currentPattern + 1) % patterns.length;
        });

        window.addEventListener('pointercancel', () => isHolding = false);

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            objects.forEach((obj) => {
                const dest = isHolding ? obj.targets[currentPattern] : obj.startP;
                obj.mesh.position.lerp(dest, 0.09);
                obj.mesh.rotation.y += 0.02;
            });
            camera.position.x = Math.sin(time * 0.15) * 0.4;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
