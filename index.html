<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bella v3.0</title>
    <style>
        :root {
            --pink-soft: #fff5f8;
            --pink-accent: #ff8da1;
            --gold-soft: #fffdf5;
            --gold-accent: #ffab00;
            --night-bg: #050510;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: var(--pink-soft); 
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        /* Glassmorphism UI */
        #ui-container {
            position: absolute; 
            bottom: 40px; 
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 24px;
            color: inherit;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nav-btn:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.5); }

        #ui-text {
            text-align: center;
            font-weight: 300; 
            letter-spacing: 4px; 
            font-size: 16px; 
            min-width: 140px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* Instruction Overlay */
        #ui-instruction {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: var(--pink-accent);
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #ui-instruction.visible { opacity: 0.7; animation: float 3s infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Theme Styling */
        .theme-pink { color: #d63384; border-color: #ff8da1; }
        .theme-gold { color: #b8860b; border-color: #ffd700; }
        .theme-night { color: #a0a0ff; border-color: #4a4a8a; text-shadow: 0 0 10px rgba(160,160,255,0.5); }
        .theme-bubble { color: #ff69b4; }

        #motion-prompt {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; display: none;
        }
        #motion-prompt.visible { display: block; }
        #motion-prompt button {
            background: #ff8da1; border: none; padding: 12px 30px; border-radius: 20px;
            color: white; font-weight: bold; margin-top: 15px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui-container" class="theme-pink">
        <div class="nav-btn" id="prevBtn">‹</div>
        <div id="ui-text">惊喜</div>
        <div class="nav-btn" id="nextBtn">›</div>
    </div>

    <div id="ui-instruction">戳破泡泡 / Pop the bubbles</div>

    <div id="motion-prompt">
        <p>开启重力感应<br>让阳光随你倾斜 ☀️</p>
        <button id="enableMotion">确定</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- ENGINE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- THEMES & MODES ---
        let currentMode = 0; // 0: Surprise, 1: Sun, 2: Night, 3: Bubbles
        const modes = [
            { id: 0, name: '惊喜', bg: 0xfff5f8, class: 'theme-pink' },
            { id: 1, name: '阳光', bg: 0xfffdf5, class: 'theme-gold' },
            { id: 2, name: '晚安', bg: 0x020205, class: 'theme-night' },
            { id: 3, name: '泡泡', bg: 0xfff0f5, class: 'theme-bubble' }
        ];

        // --- OBJECTS: JEWELS (Instanced for Performance) ---
        const JEWEL_COUNT = 400;
        const jewelGeo = new THREE.OctahedronGeometry(0.18, 0);
        const jewelMat = new THREE.MeshPhysicalMaterial({
            color: 0xff69b4, metalness: 0.2, roughness: 0.1,
            transmission: 0.6, thickness: 1, ior: 1.5, clearcoat: 1
        });
        const jewelMesh = new THREE.InstancedMesh(jewelGeo, jewelMat, JEWEL_COUNT);
        scene.add(jewelMesh);

        const dummy = new THREE.Object3D();
        const jewelData = Array.from({ length: JEWEL_COUNT }, () => ({
            pos: new THREE.Vector3((Math.random()-0.5)*10, -5, (Math.random()-0.5)*5),
            vel: new THREE.Vector3(),
            rot: new THREE.Euler(Math.random()*6, Math.random()*6, Math.random()*6),
            target: new THREE.Vector3()
        }));

        // --- SUN & NIGHT GROUPS ---
        const sunGroup = new THREE.Group();
        const sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 2 })
        );
        sunGroup.add(sunSphere);
        scene.add(sunGroup);

        // --- INTERACTION STATE ---
        let isPointerDown = false;
        let pointerPos = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let activePattern = 0;

        // --- LOGIC: PATTERNS ---
        const getPatternPos = (i, patternId) => {
            const scale = window.innerWidth < 600 ? 0.8 : 1.2;
            if (patternId === 0) { // Heart
                const t = i / JEWEL_COUNT * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                return new THREE.Vector3(x * 0.15 * scale, y * 0.15 * scale, 0);
            }
            if (patternId === 1) { // Circle
                const a = i / JEWEL_COUNT * Math.PI * 2;
                return new THREE.Vector3(Math.cos(a) * 3 * scale, Math.sin(a) * 3 * scale, 0);
            }
            return new THREE.Vector3((Math.random()-0.5)*10, -10, -5); // Default: Fall
        };

        // --- EVENT LISTENERS ---
        const updateModeUI = () => {
            const m = modes[currentMode];
            scene.background = new THREE.Color(m.bg);
            document.getElementById('ui-container').className = m.class;
            document.getElementById('ui-text').innerText = m.name;
            
            sunGroup.visible = (currentMode === 1);
            jewelMesh.visible = (currentMode === 0 || currentMode === 1);
            document.getElementById('ui-instruction').classList.toggle('visible', currentMode === 3);
        };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.nav-btn')) return;
            isPointerDown = true;
            if (currentMode === 0) activePattern = (activePattern + 1) % 2;
        });

        window.addEventListener('pointerup', () => isPointerDown = false);
        window.addEventListener('pointermove', (e) => {
            pointerPos.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointerPos.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.getElementById('nextBtn').onclick = () => { currentMode = (currentMode + 1) % 4; updateModeUI(); };
        document.getElementById('prevBtn').onclick = () => { currentMode = (currentMode + 3) % 4; updateModeUI(); };

        // --- MAIN ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (currentMode === 0 || currentMode === 1) {
                for (let i = 0; i < JEWEL_COUNT; i++) {
                    const d = jewelData[i];
                    const target = isPointerDown ? getPatternPos(i, activePattern) : new THREE.Vector3(d.pos.x, -6, d.pos.z);
                    
                    // Smooth spring physics
                    const force = new THREE.Vector3().subVectors(target, d.pos).multiplyScalar(0.05);
                    d.vel.add(force).multiplyScalar(0.92);
                    d.pos.add(d.vel);
                    
                    d.rot.x += d.vel.length() * 0.2;
                    d.rot.y += 0.01;

                    dummy.position.copy(d.pos);
                    dummy.rotation.copy(d.rot);
                    dummy.updateMatrix();
                    jewelMesh.setMatrixAt(i, dummy.matrix);
                }
                jewelMesh.instanceMatrix.needsUpdate = true;
            }

            if (currentMode === 1) {
                sunGroup.position.x = THREE.MathUtils.lerp(sunGroup.position.x, pointerPos.x * 5, 0.1);
                sunGroup.position.y = THREE.MathUtils.lerp(sunGroup.position.y, pointerPos.y * 5, 0.1);
                sunSphere.scale.setScalar(1 + Math.sin(time * 2) * 0.05);
            }

            renderer.render(scene, camera);
        }

        camera.position.z = 12;
        updateModeUI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
