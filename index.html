<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Jewel QT v10</title>
    <style>
        /* This section stops the blue highlighting and text selection */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #fff5f8; 
            touch-action: none; /* Stops the browser from scrolling while holding */
        }
        #ui {
            position: absolute; bottom: 60px; width: 100%; text-align: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #ff1493; font-weight: 300; letter-spacing: 4px; pointer-events: none;
            text-transform: uppercase; font-size: 10px; opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="ui">PRESS AND HOLD TO REVEAL</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f8);
        
        // Detect if mobile
        const isMobile = window.innerWidth < 600;
        const scaleFactor = isMobile ? 0.6 : 1.0; // Shrink the letters for mobile

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        const topLight = new THREE.DirectionalLight(0xffffff, 2.5);
        topLight.position.set(5, 10, 5);
        scene.add(topLight);

        const jewelGeo = new THREE.OctahedronGeometry(0.15, 0); 
        const colors = [0xff007f, 0xff69b4, 0xff1493, 0xffffff, 0xffc1cc, 0xfce4ec];

        // --- QT Points with Mobile Scaling ---
        const qtPoints = [];
        const xOffset = isMobile ? 1.2 : 2.2; // Bring Q closer to center on mobile
        
        // Q Circle
        for(let i=0; i<45; i++){
            let a = (i/45) * Math.PI * 2;
            qtPoints.push({x: (Math.cos(a)*1.8 - xOffset) * scaleFactor, y: Math.sin(a)*1.8 * scaleFactor});
        }
        // Q Tail
        for(let i=0; i<6; i++) qtPoints.push({x: (-1.0 + i*0.16 - (isMobile ? 0 : 1)) * scaleFactor, y: (-1.0 - i*0.16) * scaleFactor});
        
        // T Top Bar
        for(let i=0; i<18; i++) qtPoints.push({x: (0.5 + i*0.2) * scaleFactor, y: 1.8 * scaleFactor});
        // T Stem
        for(let i=0; i<18; i++) qtPoints.push({x: (2.2 * scaleFactor), y: (1.8 - i*0.2) * scaleFactor});

        const objects = [];
        for (let i = 0; i < 420; i++) {
            const mat = new THREE.MeshPhysicalMaterial({
                color: colors[i % colors.length],
                metalness: 0.1, roughness: 0.02, transmission: 0.4,
                thickness: 1.0, ior: 1.5, clearcoat: 1.0
            });
            const mesh = new THREE.Mesh(jewelGeo, mat);
            const startP = new THREE.Vector3((Math.random()-0.5)*4, -3.5 + Math.random(), (Math.random()-0.5)*2);
            mesh.position.copy(startP);
            scene.add(mesh);
            
            let destP = new THREE.Vector3();
            if (i < qtPoints.length) destP.set(qtPoints[i].x, qtPoints[i].y, 0);
            else destP.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, -40);
            
            objects.push({ mesh, startP, destP });
        }

        camera.position.z = isMobile ? 16 : 13; // Move camera back further on mobile

        let isHolding = false;

        window.addEventListener('pointerdown', (e) => {
            isHolding = true;
            if (window.navigator.vibrate) window.navigator.vibrate(10); // Subtle haptic
        });

        window.addEventListener('pointerup', () => isHolding = false);
        window.addEventListener('pointercancel', () => isHolding = false);

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            objects.forEach((obj) => {
                obj.mesh.position.lerp(isHolding ? obj.destP : obj.startP, 0.08);
                obj.mesh.rotation.y += 0.02;
            });
            camera.position.x = Math.sin(time * 0.15) * 0.4;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
