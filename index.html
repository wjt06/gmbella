<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bella Remastered</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #fff5f8; 
            touch-action: none; 
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; 
        }
        
        /* Smooth Transition Overlay */
        #fade-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.4s ease-in-out;
        }

        /* Glassmorphism UI */
        #ui-container {
            position: absolute; 
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            pointer-events: none;
            z-index: 10;
            transition: all 0.5s ease;
        }
        
        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 22px;
            font-weight: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .nav-btn:active { 
            transform: scale(0.9); 
            background: rgba(255, 255, 255, 0.5); 
        }
        
        #ui-text {
            text-align: center;
            font-weight: 400; 
            letter-spacing: 4px; 
            font-size: 15px; 
            min-width: 140px;
            text-transform: uppercase;
        }

        #ui-instruction {
            position: absolute;
            bottom: 110px;
            width: 100%;
            text-align: center;
            color: #ff8da1;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0; 
            transition: opacity 1s ease;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }
        #ui-instruction.visible { 
            animation: pulse 3s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1.0; transform: translateY(-3px); }
        }

        /* Dynamic Theme Colors */
        .theme-pink { color: #d81b60; }
        .theme-gold { color: #d48800; background: rgba(255, 250, 230, 0.2) !important; }
        .theme-night { 
            color: #d0d0ff; 
            background: rgba(10, 10, 30, 0.4) !important; 
            border-color: rgba(255,255,255,0.1) !important;
            text-shadow: 0 0 10px rgba(200, 200, 255, 0.5);
        }
        .theme-bubble { color: #e91e63; }
        
        #motion-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 253, 245, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(200, 150, 50, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 100;
            display: none;
            max-width: 300px;
        }
        #motion-prompt.visible { display: block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes popIn {
            0% { transform: translate(-50%, -40%) scale(0.9); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #motion-prompt p {
            color: #886622;
            margin: 0 0 20px 0;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
        }
        #motion-prompt button {
            background: linear-gradient(135deg, #ffdd44, #ffaa00);
            border: none;
            padding: 12px 36px;
            border-radius: 30px;
            color: #553300;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
        }
        #motion-prompt button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 170, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="fade-overlay"></div>
    
    <div id="ui-container" class="theme-pink">
        <button class="nav-btn" id="prevBtn">‹</button>
        <div id="ui-text">惊喜</div>
        <button class="nav-btn" id="nextBtn">›</button>
    </div>

    <div id="ui-instruction">戳破泡泡 / Pop the bubbles</div>
    
    <div id="motion-prompt">
        <p>轻轻倾斜手机<br>让小太阳跟着你移动 ☀️</p>
        <button id="enableMotion">开启</button>
    </div>

    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f8);
        const isMobile = window.innerWidth < 600;
        
        // Slightly wider FOV for a more modern cinematic feel
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1; // Tweaked for bloom
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING (THE REMASTER MAGIC) ---
        const renderScene = new RenderPass(scene, camera);
        // Resolution, strength, radius, threshold
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.8, 0.2);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- DATA & CONFIG ---
        const bubbleConfig = {
            bubbleSpeed: 1.0, 
            wobbleSpeed: 1.5,
            spawnRate: 65,
        };

        const words = [
            { en: "funny", zh: "幽默" }, { en: "smart", zh: "聪明" },
            { en: "pretty", zh: "漂亮" }, { en: "talented", zh: "有才华" },
            { en: "skilled", zh: "很厉害" }, { en: "sweet", zh: "温柔" },
            { en: "amazing", zh: "太棒了" }, { en: "great", zh: "很棒" },
            { en: "fun", zh: "有意思" }, { en: "best", zh: "最棒" },
            { en: "cute", zh: "可爱" }, { en: "wonderful", zh: "美好" },
            { en: "graceful", zh: "优雅" }, { en: "kind", zh: "善良" },
            { en: "thoughtful", zh: "体贴" }, { en: "charming", zh: "有魅力" },
            { en: "confident", zh: "自信" }, { en: "elegant", zh: "高雅" },
            { en: "warm", zh: "温暖" }, { en: "gentle", zh: "温和" },
            { en: "beautiful", zh: "很美" }, { en: "adorable", zh: "太可爱了" },
            { en: "generous", zh: "大方" }, { en: "gorgeous", zh: "太美了" }
        ];

        // --- LIGHTS ---
        const amb = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(amb);
        const sunLight = new THREE.PointLight(0xffeedd, 0, 40);
        scene.add(sunLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 2.0);
        topLight.position.set(5, 10, 5);
        scene.add(topLight);

        // --- STATE ---
        let currentMode = 0; 
        const currentHour = new Date().getHours();
        if (currentHour >= 6 && currentHour < 9) {
            currentMode = 1; 
        } else if (currentHour >= 21 || currentHour < 6) {
            currentMode = 2;
        } else {
            currentMode = Math.random() < 0.5 ? 0 : 3;
        }

        let isHolding = false;
        let currentPattern = 0;
        let sunshineTime = 0;
        let targetPos = new THREE.Vector3(0, 0, 0);
        
        // Bubble State
        const bubbles = [];
        const activeTexts = [];
        const activeParticles = [];
        let bubbleSpawnTimer = 0;
        let popCount = 0;
        
        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Softer, rounder pop sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // --- ACCELEROMETER / MOTION STATE ---
        let motionEnabled = false;
        let motionPermissionAsked = false;
        let motionSupported = !!window.DeviceOrientationEvent;
        let tiltX = 0, tiltY = 0, rawTiltX = 0, rawTiltY = 0;
        let neutralGamma = 0, neutralBeta = 45;
        let needsCalibration = true, autoDriftAngle = 0;

        // --- TEXTURE HELPERS ---
        function createCircleTexture(color, size) {
            const s = size || 128; // Higher res for bloom
            const matCanvas = document.createElement('canvas');
            matCanvas.width = s; matCanvas.height = s;
            const matCtx = matCanvas.getContext('2d');
            const center = s / 2;
            const gradient = matCtx.createRadialGradient(center, center, 0, center, center, center);
            
            if (color) {
                gradient.addColorStop(0, color);
                gradient.addColorStop(0.2, color);
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
            } else {
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
            }
            
            matCtx.fillStyle = gradient;
            matCtx.fillRect(0, 0, s, s);
            return new THREE.CanvasTexture(matCanvas);
        }

        function createTextTexture(en, zh) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Much prettier typography formatting
            ctx.font = 'italic 80px "Georgia", serif';
            ctx.fillStyle = '#ffffff'; 
            ctx.shadowColor = '#ff4d88';
            ctx.shadowBlur = 15;
            ctx.fillText(en, 256, 190);
            
            ctx.font = 'bold 90px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = '#ffb3c6'; 
            ctx.shadowBlur = 20;
            ctx.fillText(zh, 256, 320);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            return tex;
        }

        // --- JEWEL ASSETS (MODES 0 & 1) ---
        // Use Icosahedron for everything, it catches light better than Octahedron
        const jewelGeo = new THREE.IcosahedronGeometry(0.18, 0);
        const pinkColors = [0xff007f, 0xff69b4, 0xff1493, 0xffffff, 0xffc1cc, 0xfce4ec];
        const goldColors = [0xffff00, 0xffd700, 0xffaa00, 0xffffff, 0xffeebb];

        const patterns = [];
        const qOffset = (isMobile ? 1.0 : 1.8) + 0.15;
        
        // Pattern 0: QT
        const qt = [];
        for(let i=0; i<50; i++) { let a = (i/50)*Math.PI*2; qt.push({x: Math.cos(a)*1.6 - qOffset, y: Math.sin(a)*1.6}); }
        for(let i=0; i<8; i++) qt.push({x: (-qOffset + 0.8) + i*0.15, y: -0.8 - i*0.15});
        const tStartX = 0.5 - 0.15;
        for(let i=0; i<18; i++) qt.push({x: tStartX + i*0.2, y: 1.6});
        for(let i=0; i<18; i++) qt.push({x: tStartX + 1.7, y: 1.6 - i*0.2});
        patterns.push(qt);

        // Pattern 1: Smiley face
        const smile = [];
        for(let i=0; i<45; i++) { let a = (i/45)*Math.PI*2; smile.push({x: Math.cos(a)*2.2, y: Math.sin(a)*2.2}); }
        smile.push({x: -0.8, y: 0.7}, {x: 0.8, y: 0.7});
        for(let i=0; i<20; i++) { let a = Math.PI + 0.4 + (i/20)*(Math.PI - 0.8); smile.push({x: Math.cos(a)*1.3, y: Math.sin(a)*0.9 - 0.1}); }
        patterns.push(smile);

        // Pattern 2: Rose/Flower
        const rose = [];
        for(let i=0; i<40; i++) { let a = (i/40)*Math.PI*2; let r = 0.8 + Math.cos(a*5)*0.3; rose.push({x: Math.cos(a)*r, y: Math.sin(a)*r + 1.2}); }
        for(let i=0; i<18; i++) rose.push({x: 0, y: 0.8 - i*0.25});
        rose.push({x: 0.3, y: -0.5}, {x: -0.3, y: -1.2});
        patterns.push(rose);

        // Physics
        const SPRING_STIFFNESS = 0.08;
        const SPRING_DAMPING = 0.82;
        const GRAVITY = -0.012;
        const GROUND_Y = -3.5;
        const GROUND_BOUNCE = 0.4;
        const GROUND_FRICTION = 0.85;

        const objects = [];
        for (let i = 0; i < 420; i++) {
            // Enhanced material for maximum bloom and reflections
            const mat = new THREE.MeshPhysicalMaterial({ 
                color: pinkColors[i % pinkColors.length], 
                metalness: 0.2, 
                roughness: 0.1, 
                transmission: 0.6, 
                thickness: 1.5, 
                ior: 1.8, 
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            const mesh = new THREE.Mesh(jewelGeo, mat);
            const pileX = (Math.random()-0.5)*5;
            const pileY = GROUND_Y + Math.random()*1.5;
            const pileZ = (Math.random()-0.5)*2;
            mesh.position.set(pileX, pileY, pileZ);
            scene.add(mesh);
            objects.push({ 
                mesh, 
                targets: [], 
                velocity: new THREE.Vector3(0, 0, 0),
                launchDelay: Math.random() * 0.3,
                wobbleOffset: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.5 + Math.random() * 0.5,
                isSettled: true,
                restTime: 0,
                frozen: false
            });
        }

        patterns.forEach((pts) => {
            const scale = isMobile ? 0.75 : 1.0;
            objects.forEach((obj, i) => {
                let target = new THREE.Vector3();
                if (i < pts.length) target.set(pts[i].x * scale, pts[i].y * scale, 0);
                else target.set((Math.random()-0.5)*50, (Math.random()-0.5)*30, -50);
                obj.targets.push(target);
            });
        });

        // --- SUN GROUP (MODE 1) ---
        const sunGroup = new THREE.Group();
        sunGroup.visible = false;
        scene.add(sunGroup);
        
        // Sun Core
        const sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 32, 32), 
            new THREE.MeshStandardMaterial({ color: 0xffddaa, emissive: 0xffaa00, emissiveIntensity: 2.5 })
        );
        sunGroup.add(sunSphere);
        
        // Sun Halo (Glow sprite)
        const haloMat = new THREE.SpriteMaterial({ 
            map: createCircleTexture('rgba(255, 180, 50, 1)', 256), 
            color: 0xffdd88, 
            transparent: true, 
            blending: THREE.AdditiveBlending,
            opacity: 0.8
        });
        const sunHalo = new THREE.Sprite(haloMat);
        sunHalo.scale.set(4, 4, 1);
        sunGroup.add(sunHalo);

        const faceMat = new THREE.MeshBasicMaterial({ color: 0x442200 }); // Darker for contrast against bright sun
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), faceMat);
        eyeL.position.set(-0.25, 0.2, 0.86); sunGroup.add(eyeL);
        const eyeR = eyeL.clone(); eyeR.position.set(0.25, 0.2, 0.86); sunGroup.add(eyeR);
        const sunSmile = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.04, 12, 20, Math.PI), faceMat);
        sunSmile.position.set(0, -0.05, 0.84); sunSmile.rotation.x = Math.PI * 0.95; sunGroup.add(sunSmile);
        
        const cheekMat = new THREE.MeshBasicMaterial({ color: 0xff6644, transparent: true, opacity: 0.6 });
        const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), cheekMat);
        cheekL.position.set(-0.55, -0.05, 0.75); sunGroup.add(cheekL);
        const cheekR = cheekL.clone(); cheekR.position.set(0.55, -0.05, 0.75); sunGroup.add(cheekR);

        // --- BUBBLE ASSETS (MODE 3) ---
        const bubbleGeo = new THREE.SphereGeometry(0.6, 64, 64); // Higher poly for smoother reflections
        const bubbleMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.0,
            transmission: 1.0, // Fully transparent glass-like
            thickness: 0.5,
            iridescence: 1.0, // Max iridescence
            iridescenceIOR: 1.5,
            clearcoat: 1.0,
            transparent: true,
            opacity: 1.0,
        });

        const bubbleParticleGeo = new THREE.BufferGeometry();
        const bpCount = 40; 
        const bpPos = new Float32Array(bpCount * 3);
        bubbleParticleGeo.setAttribute('position', new THREE.BufferAttribute(bpPos, 3));
        const bubbleParticleMat = new THREE.PointsMaterial({
            color: 0xffddff,
            size: 0.2,
            transparent: true,
            opacity: 0.9,
            map: createCircleTexture('rgba(255,255,255,1)', 64),
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        // --- NIGHT ASSETS (MODE 2) ---
        const nightGroup = new THREE.Group();
        nightGroup.visible = false;
        scene.add(nightGroup);

        const starCount = 4000;
        const starGeo = new THREE.BufferGeometry();
        const starPosArr = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        const starBaseSizes = new Float32Array(starCount);
        const starTwinkleTime = new Float32Array(starCount);
        const starTwinkling = new Uint8Array(starCount);
        
        const colorPalette = [
            new THREE.Color(0xffffff), new THREE.Color(0xddddff), 
            new THREE.Color(0xfff0dd), new THREE.Color(0xaaccff)
        ];

        for(let i=0; i<starCount; i++) {
            starPosArr[i*3] = (Math.random() - 0.5) * 80;
            starPosArr[i*3+1] = (Math.random() - 0.5) * 60;
            starPosArr[i*3+2] = -5 - Math.random() * 25;
            
            const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            starColors[i*3] = col.r; starColors[i*3+1] = col.g; starColors[i*3+2] = col.b;

            const baseSize = 0.05 + Math.random() * 0.08;
            starBaseSizes[i] = baseSize;
            starSizes[i] = baseSize;
            starTwinkleTime[i] = Math.random() * 10;
            starTwinkling[i] = 0;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        
        const starMat = new THREE.PointsMaterial({ 
            size: 0.1, 
            transparent: true, 
            opacity: 0.9,
            blending: THREE.AdditiveBlending, 
            map: createCircleTexture('rgba(255,255,255,1)', 64),
            vertexColors: true,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starGeo, starMat);
        nightGroup.add(stars);

        // Goodnight Text
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024; canvas.height = 512;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 220px "PingFang SC", sans-serif'; 
        ctx.textAlign = 'center';
        ctx.fillText('晚安', 512, 330);
        
        const imageData = ctx.getImageData(0, 0, 1024, 512);
        const textPointsArr = [];
        const textPointsOriginal = [];
        for (let y = 0; y < 512; y += 4) {
            for (let x = 0; x < 1024; x += 4) {
                if (imageData.data[(y * 1024 + x) * 4] > 128) {
                    const jitter = 0.1;
                    const px = (x - 512) / 100 + (Math.random()-0.5) * jitter;
                    const py = -(y - 256) / 100 + (Math.random()-0.5) * jitter;
                    const pz = (Math.random()-0.5) * 0.3;
                    textPointsArr.push(px, py, pz);
                    textPointsOriginal.push(px, py, pz);
                }
            }
        }
        const textGeo = new THREE.BufferGeometry();
        textGeo.setAttribute('position', new THREE.Float32BufferAttribute(textPointsArr, 3));
        const textMat = new THREE.PointsMaterial({ 
            color: 0x99bbff, 
            size: 0.06, 
            transparent: true, 
            opacity: 0.8, 
            blending: THREE.AdditiveBlending 
        });
        const textMesh = new THREE.Points(textGeo, textMat);
        textMesh.position.y = -0.5;
        nightGroup.add(textMesh);
        const textPositions = textMesh.geometry.attributes.position;

        // --- EVENT HANDLERS & LOGIC ---
        function handleOrientation(event) {
            if (!motionEnabled) return;
            const gamma = event.gamma || 0;
            const beta = event.beta || 0;
            
            if (needsCalibration) {
                neutralGamma = gamma; neutralBeta = beta; needsCalibration = false;
            }
            
            const maxTilt = 25;
            rawTiltX = Math.max(-1, Math.min(1, (gamma - neutralGamma) / maxTilt));
            rawTiltY = Math.max(-1, Math.min(1, (beta - neutralBeta) / maxTilt));
            
            tiltX = tiltX * 0.7 + rawTiltX * 0.3;
            tiltY = tiltY * 0.7 + rawTiltY * 0.3;
        }

        document.getElementById('enableMotion').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const p = await DeviceOrientationEvent.requestPermission();
                    if (p === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        motionEnabled = true;
                    }
                } catch (e) { console.log(e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                motionEnabled = true;
            }
            document.getElementById('motion-prompt').classList.remove('visible');
            motionPermissionAsked = true;
        });

        // Bubble Logic
        function spawnBubble(preWarm = false) {
            const mesh = new THREE.Mesh(bubbleGeo, bubbleMat);
            const rangeX = isMobile ? 3.5 : 7.0;
            const x = (Math.random() - 0.5) * rangeX;
            const y = preWarm ? -8 + Math.random() * 12 : -8;
            mesh.position.set(x, y, (Math.random() - 0.5) * 2);
            const scale = 0.7 + Math.random() * 0.5;
            mesh.scale.setScalar(scale);
            scene.add(mesh);

            bubbles.push({
                mesh: mesh,
                speed: bubbleConfig.bubbleSpeed * (0.8 + Math.random() * 0.5),
                wobbleOffset: Math.random() * Math.PI * 2,
                baseX: x, scale: scale
            });
        }

        function spawnBubbleParticles(pos) {
            const geo = bubbleParticleGeo.clone();
            const positions = new Float32Array(bpCount * 3);
            const velocities = [];
            for(let i=0; i<bpCount; i++) {
                positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.08 + Math.random() * 0.15; // More explosive pop
                velocities.push({
                    x: speed * Math.sin(phi) * Math.cos(theta),
                    y: speed * Math.sin(phi) * Math.sin(theta),
                    z: speed * Math.cos(phi)
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const ps = new THREE.Points(geo, bubbleParticleMat.clone());
            scene.add(ps);
            activeParticles.push({ mesh: ps, velocities: velocities, life: 1.0 });
        }

        function createBubbleWord(pos, scale) {
            let en, zh;
            if (popCount === 0) { en = "Ling"; zh = "玲"; } 
            else if (popCount === 1) { en = "is"; zh = "是"; } 
            else {
                const r = words[Math.floor(Math.random() * words.length)];
                en = r.en; zh = r.zh;
            }
            popCount++;
            const tex = createTextTexture(en, zh);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            sprite.position.copy(pos);
            const s = scale * 2.8; 
            sprite.scale.set(s, s, 1);
            scene.add(sprite);
            activeTexts.push({ sprite: sprite, life: 4.0, maxOpacity: 1.0, floatSpeed: 0.015 });
        }

        function checkBubblePop(event) {
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            const clientX = event.clientX || (event.touches ? event.touches[0].clientX : 0);
            const clientY = event.clientY || (event.touches ? event.touches[0].clientY : 0);
            pointer.x = (clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            
            const intersects = raycaster.intersectObjects(bubbles.map(b => b.mesh));
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const index = bubbles.findIndex(b => b.mesh === hitMesh);
                if (index !== -1) {
                    const b = bubbles[index];
                    playPopSound();
                    spawnBubbleParticles(b.mesh.position);
                    createBubbleWord(b.mesh.position, b.scale);
                    scene.remove(b.mesh);
                    b.mesh.geometry.dispose();
                    bubbles.splice(index, 1);
                }
            }
        }

        // --- UI & THEME TRANSITIONS ---
        const fadeOverlay = document.getElementById('fade-overlay');
        
        const applyThemeVariables = () => {
            const ui = document.getElementById('ui-container');
            const txt = document.getElementById('ui-text');
            const instr = document.getElementById('ui-instruction');
            const prompt = document.getElementById('motion-prompt');
            
            sunGroup.visible = (currentMode === 1);
            nightGroup.visible = (currentMode === 2);
            objects.forEach(obj => obj.mesh.visible = (currentMode === 0 || currentMode === 1));
            
            if (currentMode !== 3) {
                 bubbles.forEach(b => scene.remove(b.mesh)); bubbles.length = 0;
                 activeTexts.forEach(t => scene.remove(t.sprite)); activeTexts.length = 0;
                 activeParticles.forEach(p => scene.remove(p.mesh)); activeParticles.length = 0;
                 instr.classList.remove('visible');
            }

            if (currentMode === 0) {
                scene.background.set(0xfff5f8);
                ui.className = 'theme-pink';
                txt.innerText = '长按开启惊喜';
                sunLight.intensity = 0;
                bloomPass.strength = 1.0; // Moderate bloom for jewels
                objects.forEach((obj, i) => {
                    obj.mesh.material.color.set(pinkColors[i % pinkColors.length]);
                    obj.mesh.material.emissiveIntensity = 0;
                });
                prompt.classList.remove('visible');
            } else if (currentMode === 1) {
                scene.background.set(0xfffdf5);
                ui.className = 'theme-gold';
                txt.innerText = '阳光';
                bloomPass.strength = 1.8; // High bloom for sun
                objects.forEach((obj, i) => {
                    const c = goldColors[i % goldColors.length];
                    obj.mesh.material.color.set(c);
                    obj.mesh.material.emissive.set(c);
                    obj.mesh.material.emissiveIntensity = 0.8;
                });
                if (isMobile && motionSupported && !motionPermissionAsked && !motionEnabled) {
                    prompt.classList.add('visible');
                }
            } else if (currentMode === 2) {
                scene.background.set(0x0a0a14); // Darker, richer night blue
                ui.className = 'theme-night';
                txt.innerText = '晚安';
                bloomPass.strength = 2.0; // Make stars and text glow
                prompt.classList.remove('visible');
            } else if (currentMode === 3) {
                scene.background.set(0xffeef5); // Softer pink background
                ui.className = 'theme-bubble';
                txt.innerText = '泡泡';
                sunLight.intensity = 0;
                bloomPass.strength = 0.6; // Subtle bloom for bubbles
                prompt.classList.remove('visible');
                instr.classList.add('visible');
                if (bubbles.length === 0) {
                    for(let k=0; k<6; k++) spawnBubble(true);
                }
            }
        };

        const updateMode = () => {
            // Trigger Fade
            fadeOverlay.style.background = currentMode === 2 ? '#000000' : '#ffffff';
            fadeOverlay.style.opacity = '1';
            
            setTimeout(() => {
                applyThemeVariables();
                fadeOverlay.style.opacity = '0';
            }, 400); // Wait for fade to peak before swapping
        };

        // Inputs
        let holdStartTime = 0;
        const handleDown = (e) => {
            if (e.target.closest('.nav-btn')) return;
            if (currentMode === 3) { checkBubblePop(e); return; }
            
            isHolding = true;
            holdStartTime = Date.now() * 0.001;
            if (window.navigator.vibrate) window.navigator.vibrate(10);
            updateTarget(e);
            
            objects.forEach(obj => { obj.isSettled = false; obj.restTime = 0; obj.frozen = false; });
        };
        
        const updateTarget = (e) => {
            if (currentMode === 3) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            targetPos.set(x * 7.5, y * 5.5, 0);
        };

        window.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointermove', updateTarget);
        window.addEventListener('pointerup', () => {
            if (!isHolding) return;
            isHolding = false;
            if (currentMode === 0) {
                currentPattern = (currentPattern + 1) % patterns.length;
                objects.forEach(obj => {
                    obj.velocity.y += 0.03 + Math.random() * 0.05; // Slightly stronger pop
                    obj.velocity.x += (Math.random() - 0.5) * 0.03;
                    obj.isSettled = false;
                });
            } else if (currentMode === 1 && isMobile && motionEnabled) {
                neutralGamma += rawTiltX * 25; neutralBeta += rawTiltY * 25;
                tiltX = 0; tiltY = 0;
            }
        });

        document.getElementById('prevBtn').onclick = () => { currentMode = (currentMode + 3) % 4; updateMode(); };
        document.getElementById('nextBtn').onclick = () => { currentMode = (currentMode + 1) % 4; updateMode(); };

        // Initialize first mode immediately without fade
        applyThemeVariables();

        // --- ANIMATION LOOP ---
        camera.position.z = isMobile ? 15 : 13;
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            if (currentMode === 0) {
                // JEWEL PHYSICS
                objects.forEach((obj, index) => {
                    if (isHolding) {
                        obj.restTime = 0; obj.frozen = false; obj.isSettled = false;
                        const target = obj.targets[currentPattern];
                        const launchProgress = Math.max(0, Math.min(1, (time - holdStartTime - obj.launchDelay) * 3));
                        if (launchProgress > 0) {
                            const dx = target.x - obj.mesh.position.x;
                            const dy = target.y - obj.mesh.position.y;
                            const dz = target.z - obj.mesh.position.z;
                            const stiffness = SPRING_STIFFNESS * launchProgress;
                            obj.velocity.x += dx * stiffness; obj.velocity.y += dy * stiffness; obj.velocity.z += dz * stiffness;
                            obj.velocity.multiplyScalar(SPRING_DAMPING);
                            if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 0.5) {
                                obj.velocity.x += Math.sin(time * obj.wobbleSpeed * 8 + obj.wobbleOffset) * 0.002;
                                obj.velocity.y += Math.cos(time * obj.wobbleSpeed * 6 + obj.wobbleOffset) * 0.002;
                            }
                        }
                    } else {
                        if (obj.frozen) return;
                        obj.velocity.y += GRAVITY;
                        if (obj.mesh.position.z < -5) obj.velocity.z += 0.02;
                        if (obj.mesh.position.y <= GROUND_Y + 0.15) {
                            obj.mesh.position.y = GROUND_Y + 0.15;
                            if (obj.velocity.y < -0.01) {
                                obj.velocity.y *= -GROUND_BOUNCE;
                                obj.velocity.x += (Math.random() - 0.5) * 0.02;
                            } else obj.velocity.y = 0;
                            obj.velocity.x *= GROUND_FRICTION; obj.velocity.z *= GROUND_FRICTION;
                            if (obj.mesh.position.z < -1) obj.mesh.position.z += 0.1;
                        }
                        obj.velocity.multiplyScalar(0.995);
                        if (obj.velocity.length() < 0.05 && obj.mesh.position.y <= GROUND_Y + 0.16) {
                            obj.isSettled = true;
                        } else { obj.isSettled = false; obj.restTime = 0; }
                        
                        if (obj.isSettled) {
                            obj.restTime += 0.016;
                            obj.velocity.multiplyScalar(0.8);
                            if (obj.restTime > 1.0) {
                                obj.velocity.lerp(new THREE.Vector3(0, 0, 0), 0.06);
                                if (obj.velocity.length() < 0.05) { obj.frozen = true; obj.velocity.set(0, 0, 0); }
                            }
                        }
                    }
                    if (!obj.frozen) {
                        obj.mesh.position.add(obj.velocity);
                        const speed = obj.velocity.length();
                        if (speed > 0.001) {
                            obj.mesh.rotation.x += obj.velocity.y * 0.5;
                            obj.mesh.rotation.y += obj.velocity.x * 0.5;
                            obj.mesh.rotation.z += speed * 0.1;
                        }
                    }
                });
            } else if (currentMode === 1) {
                // SUN PHYSICS
                sunshineTime += 0.008;
                if (isMobile && !isHolding) {
                    if (motionEnabled) {
                        targetPos.x = tiltX * 2.5; targetPos.y = tiltY * 2.5; targetPos.z = 0;
                    } else {
                        autoDriftAngle += 0.008;
                        targetPos.x = Math.sin(autoDriftAngle) * 2.5; targetPos.y = Math.sin(autoDriftAngle * 2) * 1.5; targetPos.z = 0;
                    }
                }
                sunGroup.position.lerp(targetPos, 0.08);
                sunLight.position.copy(sunGroup.position);
                
                const glowPulse = Math.sin(time * 2.0) * 0.2;
                sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, isHolding ? 50 : 25 + glowPulse * 10, 0.1);
                sunSphere.material.emissiveIntensity = 2.0 + glowPulse;
                sunHalo.scale.setScalar(isHolding ? 5 : 4 + glowPulse);
                
                sunSphere.scale.lerp(new THREE.Vector3().setScalar(isHolding ? 1.15 : 1.0), 0.1);
                
                const sunSpeed = sunGroup.position.distanceTo(targetPos);
                const squint = isHolding ? 0.4 : Math.max(0.85, 1 - sunSpeed * 2);
                eyeL.scale.y = THREE.MathUtils.lerp(eyeL.scale.y, squint, 0.1);
                eyeR.scale.y = eyeL.scale.y;
                sunSmile.scale.lerp(new THREE.Vector3().setScalar(isHolding ? 1.2 : 1.0), 0.08);
                
                objects.forEach((j) => {
                    if (isHolding) {
                        const vT = sunGroup.position.clone().add(new THREE.Vector3(0, 0, 1.2));
                        const dir = new THREE.Vector3().subVectors(vT, j.mesh.position);
                        const dist = dir.length();
                        dir.normalize();
                        j.velocity.add(dir.clone().multiplyScalar((15 - dist) * 0.015));
                        j.velocity.add(new THREE.Vector3(-dir.y, dir.x, 0).multiplyScalar(0.06)); // Stronger swirl
                    } else {
                        const a = (sunshineTime * j.wobbleSpeed) + j.wobbleOffset;
                        const rB = 1.0 + Math.sin(sunshineTime * 0.5 + j.wobbleOffset) * 0.3;
                        const bT = sunGroup.position.clone().add(new THREE.Vector3(Math.cos(a)*rB, Math.sin(a)*rB, -0.6));
                        const dir = new THREE.Vector3().subVectors(bT, j.mesh.position);
                        j.velocity.add(dir.normalize().multiplyScalar(Math.max(0, (12 - dir.length()) * 0.008)));
                        const cDir = new THREE.Vector3().subVectors(sunGroup.position, j.mesh.position);
                        if(cDir.length() < 1.2) j.velocity.add(cDir.normalize().multiplyScalar(-0.02));
                    }
                    j.velocity.multiplyScalar(0.92);
                    j.mesh.position.add(j.velocity);
                    j.mesh.rotation.x += 0.02; j.mesh.rotation.y += 0.02;
                });
            } else if (currentMode === 2) {
                // NIGHT PHYSICS
                const starSizeAttr = starGeo.attributes.size;
                if (Math.random() < 0.05) {
                    const randomStar = Math.floor(Math.random() * starCount);
                    if (!starTwinkling[randomStar]) { starTwinkling[randomStar] = 1; starTwinkleTime[randomStar] = 0; }
                }
                for (let i = 0; i < starCount; i++) {
                    if (starTwinkling[i]) {
                        starTwinkleTime[i] += 0.05;
                        if (starTwinkleTime[i] < 1) starSizeAttr.array[i] = starBaseSizes[i] * (1 + starTwinkleTime[i] * 2.0);
                        else if (starTwinkleTime[i] < 2) starSizeAttr.array[i] = starBaseSizes[i] * (1 + (2 - starTwinkleTime[i]) * 2.0);
                        else { starSizeAttr.array[i] = starBaseSizes[i]; starTwinkling[i] = 0; }
                    }
                }
                starSizeAttr.needsUpdate = true;
                
                const textPosArray = textPositions.array;
                for (let i = 0; i < textPointsOriginal.length / 3; i++) {
                    const i3 = i * 3;
                    const drift = Math.sin(time * 0.6 + textPointsOriginal[i3] * 0.4) * 0.008;
                    textPosArray[i3] = textPointsOriginal[i3] + drift;
                    textPosArray[i3+1] = textPointsOriginal[i3+1] + Math.sin(time * 0.5 + i * 0.003) * 0.005;
                }
                textPositions.needsUpdate = true;
                textMat.opacity = 0.6 + Math.sin(time * 0.8) * 0.15;
                textMesh.rotation.y = Math.sin(time * 0.2) * 0.02;
                
                if (isHolding) {
                    textMat.color.setHSL(0.6, 0.4, 0.9);
                    textMat.opacity = 0.9;
                    sunLight.position.set(targetPos.x, targetPos.y, 2);
                    sunLight.intensity = 15;
                } else {
                    textMat.color.setHSL(0.6, 0.3, 0.7);
                    sunLight.intensity = 0;
                }
            } else if (currentMode === 3) {
                // BUBBLE PHYSICS
                bubbleSpawnTimer++;
                if (bubbleSpawnTimer > bubbleConfig.spawnRate) {
                    spawnBubble(); bubbleSpawnTimer = 0;
                }
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];
                    b.mesh.position.y += b.speed * 0.016; 
                    b.mesh.position.x = b.baseX + Math.sin(time * bubbleConfig.wobbleSpeed + b.wobbleOffset) * 0.6;
                    if (b.mesh.position.y > 8) {
                        scene.remove(b.mesh); b.mesh.geometry.dispose(); bubbles.splice(i, 1);
                    }
                }
                for (let i = activeTexts.length - 1; i >= 0; i--) {
                    const t = activeTexts[i];
                    t.life -= 0.016;
                    t.sprite.position.y += t.floatSpeed;
                    if (t.life > 1.0) {
                        if (t.sprite.material.opacity < t.maxOpacity) t.sprite.material.opacity += 0.05;
                    } else t.sprite.material.opacity = Math.max(0, t.life);
                    
                    if (t.life <= 0) {
                        scene.remove(t.sprite); t.sprite.material.map.dispose(); t.sprite.material.dispose(); activeTexts.splice(i, 1);
                    }
                }
                for (let i = activeParticles.length - 1; i >= 0; i--) {
                    const p = activeParticles[i];
                    p.life -= 0.025;
                    const positions = p.mesh.geometry.attributes.position.array;
                    for(let k=0; k<bpCount; k++) {
                        positions[k*3] += p.velocities[k].x;
                        positions[k*3+1] += p.velocities[k].y;
                        positions[k*3+2] += p.velocities[k].z;
                        p.velocities[k].y -= 0.05 * 0.016;
                    }
                    p.mesh.geometry.attributes.position.needsUpdate = true;
                    p.mesh.material.opacity = p.life;
                    if (p.life <= 0) {
                        scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); activeParticles.splice(i, 1);
                    }
                }
            }

            camera.position.x = Math.sin(time * 0.15) * 0.4;
            camera.lookAt(0, 0, 0);
            
            // Use Composer for Bloom instead of standard renderer
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
