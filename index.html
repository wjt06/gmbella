<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Jewel Triple v21</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #fff5f8; 
            transition: background 1.2s ease;
            touch-action: none; 
        }
        #ui-container {
            position: absolute; 
            bottom: 50px; 
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; 
            pointer-events: none;
            z-index: 10;
        }
        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid currentColor;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-size: 20px;
            font-weight: 200;
        }
        .nav-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.4); }
        
        #ui-text {
            text-align: center;
            font-weight: 300; 
            letter-spacing: 3px; 
            font-size: 14px; 
            opacity: 0.8;
            min-width: 180px;
        }

        .theme-pink { color: #ff1493; }
        .theme-gold { color: #ffab00; }
        .theme-night { color: #a0a0ff; text-shadow: 0 0 15px rgba(100, 100, 255, 0.6); }
        
        /* Shimmer overlay for extra polish */
        #shimmer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at 30% 20%, rgba(255,182,193,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(255,105,180,0.06) 0%, transparent 50%);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="shimmer"></div>
    <div id="ui-container" class="theme-pink">
        <div class="nav-btn" id="prevBtn">‹</div>
        <div id="ui-text">惊喜</div>
        <div class="nav-btn" id="nextBtn">›</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f8);
        const isMobile = window.innerWidth < 600;
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const amb = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(amb);
        const sunLight = new THREE.PointLight(0xfff700, 0, 30);
        scene.add(sunLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 2.0);
        topLight.position.set(5, 10, 5);
        scene.add(topLight);
        
        // Rim light for extra sparkle
        const rimLight = new THREE.DirectionalLight(0xffb6c1, 1.2);
        rimLight.position.set(-5, 3, -5);
        scene.add(rimLight);

        // --- STATE ---
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const shenzhenTime = new Date(utc + (3600000 * 8));
        const currentHour = shenzhenTime.getHours();

        let currentMode = 0;
        if (currentHour >= 6 && currentHour < 9) {
            currentMode = 1; 
        } else if (currentHour >= 21 || currentHour < 6) {
            currentMode = 2;
        }

        let isHolding = false;
        let holdStartTime = 0;
        let currentPattern = 0;
        let sunshineTime = 0;
        let targetPos = new THREE.Vector3(0, 0, 0);
        let pointerPos = new THREE.Vector2(0, 0);
        let lastTapTime = 0;

        // --- TEXTURE HELPER ---
        function createCircleTexture(color, size) {
            const matCanvas = document.createElement('canvas');
            matCanvas.width = size; matCanvas.height = size;
            const matCtx = matCanvas.getContext('2d');
            const center = size / 2;
            const gradient = matCtx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(120, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            matCtx.fillStyle = gradient;
            matCtx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(matCanvas);
        }

        // --- JEWEL GEOMETRIES ---
        const jewelGeo = new THREE.OctahedronGeometry(0.15, 0);
        const jewelIcoGeo = new THREE.IcosahedronGeometry(0.18, 0);
        const jewelTetraGeo = new THREE.TetrahedronGeometry(0.16, 0);
        const jewelDodecaGeo = new THREE.DodecahedronGeometry(0.13, 0);
        const geometries = [jewelGeo, jewelIcoGeo, jewelTetraGeo, jewelDodecaGeo];
        
        // More varied, richer pink palette
        const pinkColors = [
            0xff007f, 0xff69b4, 0xff1493, 0xffffff, 0xffc1cc, 0xfce4ec,
            0xff85a2, 0xffb6c1, 0xdb7093, 0xffd1dc, 0xff6b9d, 0xf8bbd9
        ];
        const goldColors = [0xffff00, 0xffd700, 0xffaa00, 0xffffff];

        // --- PATTERN GENERATION ---
        const patterns = [];
        
        // Pattern 0: QT
        const qt = [];
        const qOffset = (isMobile ? 1.0 : 1.8) + 0.15;
        for(let i=0; i<50; i++) { let a = (i/50)*Math.PI*2; qt.push({x: Math.cos(a)*1.6 - qOffset, y: Math.sin(a)*1.6}); }
        for(let i=0; i<8; i++) qt.push({x: (-qOffset + 0.8) + i*0.15, y: -0.8 - i*0.15});
        const tStartX = 0.5 - 0.15;
        for(let i=0; i<18; i++) qt.push({x: tStartX + i*0.2, y: 1.6});
        for(let i=0; i<18; i++) qt.push({x: tStartX + 1.7, y: 1.6 - i*0.2});
        patterns.push(qt);

        // Pattern 1: Smile
        const smile = [];
        for(let i=0; i<45; i++) { let a = (i/45)*Math.PI*2; smile.push({x: Math.cos(a)*2.2, y: Math.sin(a)*2.2}); }
        smile.push({x: -0.8, y: 0.7}, {x: 0.8, y: 0.7});
        for(let i=0; i<20; i++) { let a = Math.PI + 0.4 + (i/20)*(Math.PI - 0.8); smile.push({x: Math.cos(a)*1.3, y: Math.sin(a)*0.9 - 0.1}); }
        patterns.push(smile);

        // Pattern 2: Rose
        const rose = [];
        for(let i=0; i<40; i++) { let a = (i/40)*Math.PI*2; let r = 0.8 + Math.cos(a*5)*0.3; rose.push({x: Math.cos(a)*r, y: Math.sin(a)*r + 1.2}); }
        for(let i=0; i<18; i++) rose.push({x: 0, y: 0.8 - i*0.25});
        rose.push({x: 0.3, y: -0.5}, {x: -0.3, y: -1.2});
        patterns.push(rose);
        
        // Pattern 3: Cute Sun
        const sun = [];
        // Center circle
        for(let i=0; i<30; i++) { 
            let a = (i/30)*Math.PI*2; 
            sun.push({x: Math.cos(a)*1.0, y: Math.sin(a)*1.0}); 
        }
        // Rays
        for(let r=0; r<8; r++) {
            let angle = (r/8)*Math.PI*2;
            for(let i=0; i<6; i++) {
                let dist = 1.3 + i*0.25;
                sun.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
            }
        }
        // Eyes
        sun.push({x: -0.35, y: 0.25}, {x: 0.35, y: 0.25});
        // Smile arc
        for(let i=0; i<12; i++) { 
            let a = Math.PI + 0.3 + (i/12)*(Math.PI - 0.6); 
            sun.push({x: Math.cos(a)*0.5, y: Math.sin(a)*0.4 - 0.1}); 
        }
        patterns.push(sun);
        
        // Pattern 4: 玲 character
        const ling = [];
        // Left side - 王 radical (simplified)
        // Top horizontal
        for(let i=0; i<8; i++) ling.push({x: -2.0 + i*0.2, y: 1.8});
        // Middle horizontal
        for(let i=0; i<6; i++) ling.push({x: -1.8 + i*0.2, y: 0.9});
        // Bottom horizontal
        for(let i=0; i<8; i++) ling.push({x: -2.0 + i*0.2, y: 0});
        // Vertical
        for(let i=0; i<12; i++) ling.push({x: -1.1, y: 1.8 - i*0.15});
        
        // Right side - 令
        // Top part (人 shape)
        for(let i=0; i<8; i++) ling.push({x: 0.5 + i*0.12, y: 1.8 - i*0.15});
        for(let i=0; i<8; i++) ling.push({x: 1.5 - i*0.12, y: 1.8 - i*0.15});
        // Middle horizontal with dot
        for(let i=0; i<10; i++) ling.push({x: 0.3 + i*0.15, y: 0.5});
        ling.push({x: 1.0, y: 0.9}); // dot
        // Bottom part
        for(let i=0; i<6; i++) ling.push({x: 0.6 + i*0.12, y: 0.1 - i*0.12});
        for(let i=0; i<6; i++) ling.push({x: 1.5 - i*0.12, y: 0.1 - i*0.12});
        patterns.push(ling);

        // --- CREATE JEWELS ---
        const objects = [];
        const numJewels = 300; // Slightly reduced for better performance
        
        for (let i = 0; i < numJewels; i++) {
            const geoType = geometries[Math.floor(Math.random() * geometries.length)];
            const colorIdx = i % pinkColors.length;
            
            const mat = new THREE.MeshPhysicalMaterial({ 
                color: pinkColors[colorIdx], 
                metalness: 0.15, 
                roughness: 0.02, 
                transmission: 0.45, 
                thickness: 1.2, 
                ior: 1.8, 
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                envMapIntensity: 1.0
            });
            
            const mesh = new THREE.Mesh(geoType, mat);
            
            // More organic initial pile distribution
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 2.5;
            const startP = new THREE.Vector3(
                Math.cos(angle) * radius * 0.8,
                -3.0 + Math.random() * 1.5 + Math.sin(angle * 3) * 0.3,
                (Math.random() - 0.5) * 1.5
            );
            
            mesh.position.copy(startP);
            mesh.scale.setScalar(0.8 + Math.random() * 0.4);
            scene.add(mesh);
            
            objects.push({ 
                mesh, 
                startP: startP.clone(),
                restPos: startP.clone(), // Where it floats at rest
                targets: [], 
                velocity: new THREE.Vector3(), 
                // Individual personality
                noiseOffset: Math.random() * 1000,
                freq: 0.5 + Math.random() * 1.0,
                rotSpeed: (Math.random() - 0.5) * 0.08,
                rotSpeedY: (Math.random() - 0.5) * 0.06,
                floatAmp: 0.02 + Math.random() * 0.04,
                floatFreq: 0.3 + Math.random() * 0.5,
                springStiffness: 0.06 + Math.random() * 0.04,
                damping: 0.85 + Math.random() * 0.08,
                delay: i * 0.002, // Staggered animation
                baseScale: 0.8 + Math.random() * 0.4,
                pulsePhase: Math.random() * Math.PI * 2,
                colorIdx: colorIdx
            });
        }

        // Generate targets for each pattern
        patterns.forEach((pts) => {
            const scale = isMobile ? 0.65 : 0.9;
            objects.forEach((obj, i) => {
                let target = new THREE.Vector3();
                if (i < pts.length) {
                    // Add slight z-variation for depth
                    target.set(
                        pts[i].x * scale, 
                        pts[i].y * scale, 
                        (Math.random() - 0.5) * 0.3
                    );
                } else {
                    // Extra jewels scatter beautifully around the shape
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 4 + Math.random() * 3;
                    target.set(
                        Math.cos(angle) * dist,
                        Math.sin(angle) * dist,
                        -2 - Math.random() * 3
                    );
                }
                obj.targets.push(target);
            });
        });

        // --- SPARKLE PARTICLES FOR MODE 0 ---
        const sparkleCount = 100;
        const sparkleGeo = new THREE.BufferGeometry();
        const sparklePos = new Float32Array(sparkleCount * 3);
        const sparkleAlpha = new Float32Array(sparkleCount);
        for(let i = 0; i < sparkleCount; i++) {
            sparklePos[i*3] = (Math.random() - 0.5) * 8;
            sparklePos[i*3+1] = (Math.random() - 0.5) * 6;
            sparklePos[i*3+2] = (Math.random() - 0.5) * 2;
            sparkleAlpha[i] = Math.random();
        }
        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));
        const sparkleMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.08,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            map: createCircleTexture('#fff0f5', 32)
        });
        const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
        scene.add(sparkles);

        // --- SUN GROUP (MODE 1) ---
        const sunGroup = new THREE.Group();
        sunGroup.visible = false;
        scene.add(sunGroup);
        const sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 32, 32), 
            new THREE.MeshStandardMaterial({ 
                color: 0xffff00, 
                emissive: 0xffea00, 
                emissiveIntensity: 1.2 
            })
        );
        sunGroup.add(sunSphere);
        const faceMat = new THREE.MeshBasicMaterial({ color: 0xfffdf0 });
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), faceMat);
        eyeL.position.set(-0.25, 0.2, 0.85); sunGroup.add(eyeL);
        const eyeR = eyeL.clone(); eyeR.position.set(0.25, 0.2, 0.85); sunGroup.add(eyeR);
        const sunSmile = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.04, 12, 20, Math.PI), faceMat);
        sunSmile.position.set(0, -0.05, 0.82); sunSmile.rotation.x = Math.PI * 0.95; sunGroup.add(sunSmile);

        // --- NIGHT ASSETS (MODE 2) ---
        const nightGroup = new THREE.Group();
        nightGroup.visible = false;
        scene.add(nightGroup);

        const starCount = 1500;
        const starGeo = new THREE.BufferGeometry();
        const starPosArr = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            starPosArr[i*3] = (Math.random() - 0.5) * 60;
            starPosArr[i*3+1] = (Math.random() - 0.5) * 40;
            starPosArr[i*3+2] = (Math.random() - 0.8) * 20;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.12, 
            transparent: true, 
            opacity: 0.8, 
            blending: THREE.AdditiveBlending, 
            map: createCircleTexture('#ffffff', 64) 
        });
        const stars = new THREE.Points(starGeo, starMat);
        nightGroup.add(stars);

        // Goodnight Text
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024; canvas.height = 512;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 240px serif'; 
        ctx.textAlign = 'center';
        ctx.fillText('晚安', 512, 330);
        
        const imageData = ctx.getImageData(0, 0, 1024, 512);
        const textPointsArr = [];
        for (let y = 0; y < 512; y += 4) {
            for (let x = 0; x < 1024; x += 4) {
                if (imageData.data[(y * 1024 + x) * 4] > 128) {
                    const jitter = 0.10;
                    textPointsArr.push(
                        (x - 512) / 100 + (Math.random()-0.5) * jitter,
                        -(y - 256) / 100 + (Math.random()-0.5) * jitter, 
                        (Math.random()-0.5) * 0.2
                    );
                }
            }
        }
        const textGeo = new THREE.BufferGeometry();
        textGeo.setAttribute('position', new THREE.Float32BufferAttribute(textPointsArr, 3));
        const textMat = new THREE.PointsMaterial({ 
            color: 0xccddee, 
            size: 0.045, 
            transparent: true, 
            opacity: 0.7, 
            blending: THREE.AdditiveBlending 
        });
        const textMesh = new THREE.Points(textGeo, textMat);
        nightGroup.add(textMesh);

        // Night Burst Particles
        const pCount = 1000; 
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3).fill(0);
        const pVel = new Float32Array(pCount * 3).fill(0);
        const pLife = new Float32Array(pCount).fill(0); 
        const initialVel = new Float32Array(pCount * 3).fill(0);
        const baseColors = new Float32Array(pCount * 3);
        const particleColors = new Float32Array(pCount * 3);
        const aScales = new Float32Array(pCount).fill(1.0);

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        pGeo.setAttribute('aScale', new THREE.BufferAttribute(aScales, 1));

        const pMat = new THREE.PointsMaterial({ 
            size: 0.18, 
            transparent: true, 
            blending: THREE.AdditiveBlending, 
            vertexColors: true, 
            map: createCircleTexture('#ffffff', 64), 
            depthWrite: false 
        });
        pMat.sizeAttenuation = true;
        pMat.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nattribute float aScale;')
                .replace('#include <size_vertex>', 
                    'gl_PointSize = size * aScale;\n#ifdef USE_SIZEATTENUATION\n  gl_PointSize *= ( scale / - mvPosition.z );\n#endif'
                );
        };
        const nightParticles = new THREE.Points(pGeo, pMat);
        nightGroup.add(nightParticles);

        const posA = nightParticles.geometry.attributes.position;
        const colA = nightParticles.geometry.attributes.color;
        const scaleAttr = nightParticles.geometry.attributes.aScale;

        let pIndex = 0;

        // --- THEME SWAP ---
        const updateMode = () => {
            const ui = document.getElementById('ui-container');
            const txt = document.getElementById('ui-text');
            const shimmer = document.getElementById('shimmer');
            sunGroup.visible = (currentMode === 1);
            nightGroup.visible = (currentMode === 2);
            sparkles.visible = (currentMode === 0);
            objects.forEach(obj => obj.mesh.visible = (currentMode !== 2));

            if (currentMode === 0) {
                scene.background.set(0xfff5f8);
                ui.className = 'theme-pink';
                txt.innerText = '长按开启惊喜';
                sunLight.intensity = 0;
                shimmer.style.opacity = '1';
                objects.forEach((obj, i) => {
                    obj.mesh.geometry = geometries[i % geometries.length];
                    obj.mesh.material.color.set(pinkColors[obj.colorIdx]);
                    obj.mesh.material.emissive.set(0x000000);
                    obj.mesh.material.emissiveIntensity = 0;
                });
            } else if (currentMode === 1) {
                scene.background.set(0xfffdf5);
                ui.className = 'theme-gold';
                txt.innerText = '阳光';
                shimmer.style.opacity = '0';
                objects.forEach((obj, i) => {
                    obj.mesh.geometry = jewelIcoGeo;
                    const c = goldColors[i % goldColors.length];
                    obj.mesh.material.color.set(c);
                    obj.mesh.material.emissive.set(c);
                    obj.mesh.material.emissiveIntensity = 0.5;
                });
            } else {
                scene.background.set(0x020205);
                ui.className = 'theme-night';
                txt.innerText = '晚安';
                shimmer.style.opacity = '0';
            }
        };

        // --- INPUTS ---
        const handleDown = (e) => {
            if (e.target.closest('.nav-btn')) return;
            isHolding = true;
            holdStartTime = Date.now();
            if (window.navigator.vibrate) window.navigator.vibrate(10);
            updateTarget(e);
        };
        
        const updateTarget = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            pointerPos.set(clientX, clientY);
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            if(currentMode === 2) {
                const vec = new THREE.Vector3(x, y, 0.5).unproject(camera);
                const dir = vec.sub(camera.position).normalize();
                targetPos.copy(camera.position).add(dir.multiplyScalar(-camera.position.z / dir.z));
            } else {
                targetPos.set(x * 7.5, y * 5.5, 0);
            }
        };

        window.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointermove', (e) => {
            updateTarget(e);
        });
        window.addEventListener('pointerup', () => {
            if (!isHolding) return;
            isHolding = false;
            if (currentMode === 0) {
                currentPattern = (currentPattern + 1) % patterns.length;
            }
        });

        document.getElementById('prevBtn').onclick = () => { 
            currentMode = (currentMode + 2) % 3; 
            updateMode(); 
        };
        document.getElementById('nextBtn').onclick = () => { 
            currentMode = (currentMode + 1) % 3; 
            updateMode(); 
        };

        updateMode();

        function spawnBurst() {
            for(let i=0; i<4; i++) { 
                const idx = pIndex % pCount;
                const i3 = idx * 3;
                pPos[i3] = targetPos.x; pPos[i3+1] = targetPos.y; pPos[i3+2] = targetPos.z;
                const a = Math.random() * Math.PI * 2;
                const s = 0.01 + Math.random() * 0.02;
                pVel[i3] = Math.cos(a) * s; 
                pVel[i3+1] = Math.sin(a) * s; 
                pVel[i3+2] = (Math.random()-0.5)*0.01;
                initialVel[i3] = pVel[i3];
                initialVel[i3+1] = pVel[i3+1];
                initialVel[i3+2] = pVel[i3+2];
                pLife[idx] = 1.0;
                const isGold = Math.random() > 0.7;
                baseColors[i3] = isGold ? 1.0 : 0.7;
                baseColors[i3+1] = isGold ? 0.9 : 0.8;
                baseColors[i3+2] = isGold ? 0.5 : 1.0;
                aScales[idx] = 1.0;
                pIndex++;
            }
        }

        // --- ANIMATION LOOP ---
        camera.position.z = isMobile ? 15 : 13;
        let globalTime = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            globalTime += 0.016;

            if (currentMode === 0) {
                const holdDuration = isHolding ? (Date.now() - holdStartTime) / 1000 : 0;
                const holdStrength = Math.min(holdDuration * 2, 1); // Ramps up over 0.5s
                
                objects.forEach((obj, idx) => {
                    const t = globalTime + obj.noiseOffset;
                    
                    // Determine destination
                    let dest;
                    if (isHolding) {
                        dest = obj.targets[currentPattern];
                    } else {
                        // Floating rest position with organic movement
                        const floatX = Math.sin(t * obj.floatFreq) * obj.floatAmp;
                        const floatY = Math.cos(t * obj.floatFreq * 0.7) * obj.floatAmp * 1.5;
                        const floatZ = Math.sin(t * obj.floatFreq * 0.5) * obj.floatAmp * 0.5;
                        dest = obj.startP.clone().add(new THREE.Vector3(floatX, floatY, floatZ));
                    }
                    
                    // Spring physics with stagger
                    const staggeredTime = Math.max(0, globalTime - obj.delay * 10);
                    const springActive = staggeredTime > 0;
                    
                    if (springActive) {
                        const diff = dest.clone().sub(obj.mesh.position);
                        const springForce = diff.multiplyScalar(obj.springStiffness);
                        obj.velocity.add(springForce);
                        obj.velocity.multiplyScalar(obj.damping);
                        obj.mesh.position.add(obj.velocity);
                    }
                    
                    // Rotation with personality
                    obj.mesh.rotation.x += obj.rotSpeed * (1 + holdStrength * 0.5);
                    obj.mesh.rotation.y += obj.rotSpeedY * (1 + holdStrength * 0.5);
                    
                    // Subtle pulse when holding
                    if (isHolding) {
                        const pulse = 1 + Math.sin(t * 8 + obj.pulsePhase) * 0.05 * holdStrength;
                        obj.mesh.scale.setScalar(obj.baseScale * pulse);
                    } else {
                        obj.mesh.scale.lerp(
                            new THREE.Vector3().setScalar(obj.baseScale), 
                            0.05
                        );
                    }
                });
                
                // Animate sparkles
                const sparklePositions = sparkles.geometry.attributes.position.array;
                for(let i = 0; i < sparkleCount; i++) {
                    sparklePositions[i*3+1] += 0.005;
                    if (sparklePositions[i*3+1] > 4) {
                        sparklePositions[i*3+1] = -4;
                        sparklePositions[i*3] = (Math.random() - 0.5) * 8;
                    }
                }
                sparkles.geometry.attributes.position.needsUpdate = true;
                sparkleMat.opacity = 0.3 + Math.sin(time * 2) * 0.2;
                
            } else if (currentMode === 1) {
                sunshineTime += 0.008;
                sunGroup.position.lerp(targetPos, 0.1);
                sunLight.position.copy(sunGroup.position);
                sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, isHolding ? 30 : 15, 0.1);
                sunSphere.scale.lerp(new THREE.Vector3().setScalar(isHolding ? 1.15 : 1.0), 0.1);
                
                objects.forEach((j) => {
                    if (isHolding) {
                        const vT = sunGroup.position.clone().add(new THREE.Vector3(0, 0, 1.2));
                        const dir = new THREE.Vector3().subVectors(vT, j.mesh.position);
                        const dist = dir.length();
                        dir.normalize();
                        j.velocity.add(dir.clone().multiplyScalar((15 - dist) * 0.015));
                        j.velocity.add(new THREE.Vector3(-dir.y, dir.x, 0).multiplyScalar(0.05));
                        if(dist < 3.0) j.velocity.add(dir.clone().multiplyScalar(-0.08));
                    } else {
                        const a = (sunshineTime * j.freq) + j.noiseOffset;
                        const rB = 1.0 + Math.sin(sunshineTime * 0.5 + j.noiseOffset) * 0.3;
                        const bT = sunGroup.position.clone().add(new THREE.Vector3(Math.cos(a)*rB, Math.sin(a)*rB, -0.6));
                        const dir = new THREE.Vector3().subVectors(bT, j.mesh.position);
                        j.velocity.add(dir.normalize().multiplyScalar(Math.max(0, (12 - dir.length()) * 0.008)));
                        const cDir = new THREE.Vector3().subVectors(sunGroup.position, j.mesh.position);
                        if(cDir.length() < 1.1) j.velocity.add(cDir.normalize().multiplyScalar(-0.015));
                        if (j.mesh.position.z > sunGroup.position.z - 0.2) j.velocity.z -= 0.02;
                    }
                    j.velocity.multiplyScalar(0.92);
                    j.mesh.position.add(j.velocity);
                    j.mesh.rotation.x += 0.02; 
                    j.mesh.rotation.y += 0.02;
                });
                
            } else if (currentMode === 2) {
                textMat.opacity = 0.4 + Math.sin(time * 2) * 0.2;
                textMesh.rotation.y = Math.sin(time * 0.5) * 0.05;
                
                if (isHolding) { 
                    spawnBurst(); 
                    textMat.color.setHSL(0.6, 0.8, 0.7 + Math.sin(time*10)*0.2); 
                } else { 
                    textMat.color.lerp(new THREE.Color(0xccddee), 0.1); 
                }
                
                for(let i=0; i<pCount; i++) {
                    if(pLife[i] > 0) {
                        const i3 = i * 3;
                        const remaining = pLife[i];
                        const progress = 1 - remaining;
                        const progress2 = progress * progress;

                        const sizeFactor = 1 - 1.2 * progress + 3.2 * progress2;
                        aScales[i] = sizeFactor;

                        const velFactor = 1 + 0.1 * progress - 0.6 * progress2;
                        pVel[i3] = initialVel[i3] * velFactor;
                        pVel[i3+1] = initialVel[i3+1] * velFactor;
                        pVel[i3+2] = initialVel[i3+2] * velFactor;

                        posA.array[i3] += pVel[i3]; 
                        posA.array[i3+1] += pVel[i3+1]; 
                        posA.array[i3+2] += pVel[i3+2];

                        pLife[i] -= 0.008; 
                        let f = Math.max(0, pLife[i]);

                        particleColors[i3] = baseColors[i3] * f;
                        particleColors[i3+1] = baseColors[i3+1] * f;
                        particleColors[i3+2] = baseColors[i3+2] * f;

                        if(pLife[i] <= 0) {
                            posA.array[i3] = 5000; 
                            posA.array[i3+1] = 5000;
                            posA.array[i3+2] = 5000;
                        }
                    }
                }
                posA.needsUpdate = true;
                colA.needsUpdate = true;
                scaleAttr.needsUpdate = true;

                starMat.opacity = 0.6 + Math.sin(time) * 0.3;
            }

            // Gentle camera sway
            camera.position.x = Math.sin(time * 0.15) * 0.4;
            camera.position.y = Math.cos(time * 0.1) * 0.2;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
